name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  django:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: agricore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agricore_project/requirements.txt
          # sentry-sdk installed explicitly in case it is not yet pinned in requirements.txt
          pip install sentry-sdk

      - name: Django system check
        working-directory: agricore_project
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'True'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agricore_ci
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: agricore_project
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'True'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agricore_ci
        run: python manage.py makemigrations --check --dry-run

      # NOTE: The full Django test suite is intentionally not run here because it
      # requires many third-party API env vars (payments, SMS, etc.). Enable it
      # later by adding a step that runs `python manage.py test` once the
      # required test env secrets are configured in the repository settings.
