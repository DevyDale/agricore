{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold mb-4">Add Crop</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block mb-1">Name</label>
            <input type="text" name="name" class="border rounded px-3 py-2 w-full" required>
        </div>
        <div class="mb-4">
            <label class="block mb-1">Type</label>
            <input type="text" name="type" class="border rounded px-3 py-2 w-full">
        </div>
        <div class="mb-4">
            <label class="block mb-1">Field</label>
            <input type="text" name="field" class="border rounded px-3 py-2 w-full">
        </div>
        <div class="mb-4">
            <label class="block mb-1">Planted Date</label>
            <input type="date" name="planted_date" class="border rounded px-3 py-2 w-full">
        </div>
        <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded">Save</button>
        <a href="{% url 'crop_list' %}" class="ml-4 text-gray-600">Cancel</a>
    </form>
</div>
{% endblock %}
