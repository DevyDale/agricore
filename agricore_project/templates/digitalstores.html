<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Digital Stores — Agricore</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{ --g500:#10b981; --g600:#059669; --g700:#047857; --line:#ece4d6; --ink:#16271c; }
        *{ box-sizing:border-box; font-family:'Inter',system-ui,sans-serif }
        h1,h2,h3,.fr{ font-family:'Fraunces',serif; letter-spacing:-.01em }
        body{ margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(130% 100% at 50% -10%, #fffdf8 0%, #f4efe3 62%) }

        .hero{ position:relative; overflow:hidden; color:#fff }
        #ds-farmland{ position:absolute; inset:-2% } #ds-farmland svg{ width:100%; height:100% }
        .hero-ov{ position:absolute; inset:0; background:linear-gradient(100deg, rgba(8,30,18,.86), rgba(8,30,18,.5)) }
        .hero-in{ position:relative; z-index:2; max-width:1400px; margin:0 auto; padding:1rem 1.5rem 1.6rem }
        .topbar{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap }
        .brand{ display:flex; align-items:center; gap:.6rem; font-family:Fraunces; font-weight:800; font-size:1.3rem }
        .brand .mk{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28) }
        .nav{ margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap }
        .nbtn{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); color:#fff; padding:.5rem .85rem; border-radius:999px; font-size:.84rem; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; gap:.4rem }
        .nbtn:hover{ background:rgba(255,255,255,.22); transform:translateY(-1px) }
        .nbtn.go{ background:linear-gradient(135deg,var(--g500),var(--g700)); border-color:transparent }
        h1.title{ font-size:clamp(2rem,5vw,3rem); font-weight:900; margin:1.2rem 0 .2rem }
        .sub{ color:rgba(255,255,255,.86); font-size:1.05rem }

        main{ max-width:1400px; margin:0 auto; padding:1.6rem 1.5rem 4rem }
        .card{ background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 36px -26px rgba(20,40,25,.5) }
        .controls{ display:flex; gap:.7rem; flex-wrap:wrap; padding:1rem 1.1rem; margin-bottom:1.4rem }
        .field{ background:#fff; border:1.5px solid #e2ddd0; border-radius:12px; padding:.7rem .95rem; font-size:.92rem; transition:all .2s; width:100% }
        .field:focus{ outline:none; border-color:var(--g500); box-shadow:0 0 0 3px rgba(16,185,129,.12) }
        .grow{ flex:1; min-width:220px }
        .btn{ background:linear-gradient(135deg,var(--g500),var(--g700)); color:#fff; font-weight:700; padding:.7rem 1.3rem; border:0; border-radius:12px; font-size:.92rem; cursor:pointer; transition:all .25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 6px 16px -6px rgba(5,120,80,.5); display:inline-flex; align-items:center; gap:.5rem; white-space:nowrap }
        .btn:hover{ transform:translateY(-2px) }

        .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:1.4rem }
        .store{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:1.5rem; transition:all .3s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 22px -18px rgba(20,40,25,.5) }
        .store:hover{ transform:translateY(-6px); border-color:var(--g500); box-shadow:0 18px 40px -20px rgba(5,120,80,.45) }
        .savatar{ width:48px; height:48px; border-radius:13px; background:#dcfce7; color:var(--g700); display:grid; place-items:center; font-size:1.3rem; flex:none }
        .badge{ display:inline-flex; align-items:center; gap:.3rem; padding:.3rem .75rem; border-radius:999px; font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em }
        .b-v{ background:#dcfce7; color:#166534 } .b-p{ background:#fef3c7; color:#92400e }
        .srow{ display:flex; align-items:center; gap:.55rem; color:#64748b; font-size:.9rem; margin:.4rem 0 } .srow i{ color:var(--g600); width:16px }
        .manage{ display:block; text-align:center; background:linear-gradient(135deg,var(--g500),var(--g700)); color:#fff; font-weight:600; padding:.7rem; border-radius:11px; text-decoration:none; margin-top:1rem }

        .empty{ grid-column:1/-1; text-align:center; padding:4rem 2rem; background:#fbf7ee; border:2px dashed var(--line); border-radius:18px }
        .empty i{ font-size:3.4rem; color:#cbd5c5; margin-bottom:1rem } .empty h3{ font-size:1.4rem; color:#475569 } .empty p{ color:#64748b }

        .modal{ display:none; position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(6px); z-index:1000; padding:1rem; overflow-y:auto }
        .modal.show{ display:flex; align-items:center; justify-content:center }
        .mc{ background:#fff; border-radius:20px; padding:2rem; width:100%; max-width:640px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 70px -20px rgba(6,28,15,.5); margin:auto }
        .mc h2{ font-size:1.6rem; font-weight:800; margin:0 0 1.3rem }
        label{ display:block; font-weight:600; color:#475569; font-size:.86rem; margin-bottom:.4rem }
        .fg{ display:grid; grid-template-columns:1fr 1fr; gap:1rem } .fg .full{ grid-column:1/-1 }
        .mf{ display:flex; justify-content:flex-end; gap:.7rem; margin-top:1.5rem; padding-top:1rem; border-top:1px solid #f1ece1 }
        .mbtn{ padding:.75rem 1.4rem; border-radius:12px; font-weight:600; cursor:pointer; border:0 }
        .mb-cancel{ background:#f6f1e6; color:#5b6b60; border:1.5px solid var(--line) }
        .mb-save{ background:linear-gradient(135deg,var(--g500),var(--g700)); color:#fff }
        .spin{ display:none; justify-content:center; padding:3rem } .spin.on{ display:flex }
        .sp{ width:3rem; height:3rem; border:3px solid var(--line); border-top-color:var(--g500); border-radius:50%; animation:spin 1s linear infinite }
        @keyframes spin{ to{ transform:rotate(360deg) } }
        @media(max-width:620px){ .fg{ grid-template-columns:1fr } .nav .lbl{ display:none } }
    </style>
</head>
<body>
    <header class="hero">
        <div id="ds-farmland"></div><div class="hero-ov"></div>
        <div class="hero-in">
            <div class="topbar">
                <div class="brand"><span class="mk"><i class="fas fa-store"></i></span> Agricore</div>
                <nav class="nav">
                    <a href="marketplace.html" class="nbtn"><i class="fas fa-shopping-bag"></i><span class="lbl">Marketplace</span></a>
                    <a href="chats.html" class="nbtn"><i class="fas fa-comments"></i><span class="lbl">Chats</span></a>
                    <a href="multi_farm.html" class="nbtn"><i class="fas fa-tractor"></i><span class="lbl">Your Farms</span></a>
                    <button id="openModalBtn" class="nbtn go"><i class="fas fa-plus"></i><span class="lbl">Create Store</span></button>
                </nav>
            </div>
            <h1 class="title">Your Digital Stores</h1>
            <p class="sub">Manage your marketplace presence — one storefront at a time.</p>
        </div>
    </header>

    <main>
        <div class="card controls">
            <input id="searchInput" type="text" placeholder="Search by store name or country..." class="field grow">
            <select id="verificationFilter" class="field" style="max-width:240px">
                <option value="all">All stores</option>
                <option value="verified">Verified only</option>
                <option value="not_verified">Pending verification</option>
            </select>
        </div>
        <div id="storesLoading" class="spin"><div class="sp"></div></div>
        <div id="storesGrid" class="grid"></div>
    </main>

    <!-- Create Store Modal -->
    <div id="modal" class="modal">
        <div class="mc">
            <h2>Create Digital Store</h2>
            <form id="createStoreForm">
                <div class="fg">
                    <div class="full"><label>Store Name *</label><input id="name" name="name" class="field" placeholder="e.g. Green Valley Marketplace" required></div>
                    <div><label>Owner Name</label><input id="ownerName" name="ownerName" class="field" placeholder="Your name"></div>
                    <div><label>Owner Phone</label><input id="ownerPhone" name="ownerPhone" type="tel" class="field" placeholder="+1 234 567 8900"></div>
                    <div class="full"><label>Owner Email</label><input id="ownerEmail" name="ownerEmail" type="email" class="field" placeholder="you@email.com"></div>
                    <div class="full"><label>Countries of Operation</label><input id="countries" name="countries" class="field" placeholder="e.g. Uganda, Kenya, Nigeria"><p style="font-size:.78rem;color:#94a3b8;margin:.3rem 0 0">Separate with commas</p></div>
                    <div class="full"><label>Description</label><textarea id="description" name="description" class="field" rows="3" placeholder="What does your store offer?"></textarea></div>
                    <div class="full" style="display:flex;align-items:center;gap:.7rem;background:#fbf7ee;border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem"><input type="checkbox" id="isVerified" style="width:18px;height:18px"><label for="isVerified" style="margin:0">Request verification</label></div>
                </div>
                <div class="mf"><button type="button" id="cancelBtn" class="mbtn mb-cancel">Cancel</button><button type="submit" class="mbtn mb-save">Create Store</button></div>
            </form>
        </div>
    </div>

    <script>
        (function(){ function bf(){var W=1200,H=560,cols=7,rows=4,jx=(W/cols)*.32,jy=(H/rows)*.32,P=[];for(var r=0;r<=rows;r++){P[r]=[];for(var c=0;c<=cols;c++){var e=(r===0||r===rows||c===0||c===cols);P[r][c]={x:(c/cols)*W+(e?0:(Math.random()*2-1)*jx),y:(r/rows)*H+(e?0:(Math.random()*2-1)*jy)};}}var pal=[['#2f5a34','#27502c'],['#3c7a3c','#336a33'],['#4f8438','#447730'],['#6f8d3f','#637f37'],['#8a9a4e','#7c8c42'],['#c39a48','#b58b3c'],['#d3ab57','#c59b48'],['#b15a36','#9f4e2e'],['#cdb878','#bda863']],ang=[0,16,90,74,16,0,90,30,16],defs='';pal.forEach(function(c,i){defs+='<pattern id="dp'+i+'" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate('+ang[i]+')"><rect width="9" height="9" fill="'+c[0]+'"/><rect width="9" height="3.4" fill="'+c[1]+'"/></pattern>';});var bag=[0,0,1,1,1,2,2,2,3,3,4,4,5,5,6,7,8],cells='';for(var r2=0;r2<rows;r2++)for(var c2=0;c2<cols;c2++){var a=P[r2][c2],b=P[r2][c2+1],d=P[r2+1][c2+1],e2=P[r2+1][c2],fi=bag[Math.floor(Math.random()*bag.length)];cells+='<polygon points="'+a.x.toFixed(1)+','+a.y.toFixed(1)+' '+b.x.toFixed(1)+','+b.y.toFixed(1)+' '+d.x.toFixed(1)+','+d.y.toFixed(1)+' '+e2.x.toFixed(1)+','+e2.y.toFixed(1)+'" fill="url(#dp'+fi+')" stroke="rgba(22,15,7,.16)" stroke-width="1.2"/>';}return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>'+defs+'</defs>'+cells+'</svg>';}var el=document.getElementById('ds-farmland'); if(el) el.innerHTML=bf(); })();

        const token = localStorage.getItem('access_token');
        function decodeJWT(t){ try{ return JSON.parse(decodeURIComponent(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); }catch(e){ return null; } }
        let currentUser={name:'User',email:''}; const dec=token&&decodeJWT(token); if(dec) currentUser={ name:dec.name||dec.username||'User', email:dec.email||'' };
        function sessionOk(){ if(!token){ window.location.href='authentication.html'; return false; } const d=decodeJWT(token); if(!d||!d.exp||d.exp<Math.floor(Date.now()/1000)){ alert('Your session has expired. Please log in again.'); setTimeout(()=>window.location.href='authentication.html',600); return false; } return true; }

        const $ = id=>document.getElementById(id);
        let tiles=[];
        function normC(c){ if(!c) return []; if(Array.isArray(c)) return c; if(typeof c==='string'){ const t=c.trim(); if(t.startsWith('[')){ try{ const p=JSON.parse(t); return Array.isArray(p)?p:[t]; }catch(e){ return [t]; } } return t.includes(',')?t.split(',').map(s=>s.trim()).filter(Boolean):[t]; } return []; }

        function filter(){ const q=$('searchInput').value.trim().toLowerCase(), v=$('verificationFilter').value;
            tiles.forEach(t=>{ const n=t.dataset.name||'', c=t.dataset.countries||'', ver=t.dataset.verified; t.style.display=((n.includes(q)||c.includes(q))&&(v==='all'||ver===v))?'':'none'; }); }

        async function fetchStores(){ try{ const res=await fetch('/api/stores/',{headers:{'Authorization':'Bearer '+(token||'')}}); if(!res.ok) return []; const d=await res.json(); return Array.isArray(d)?d:(d.results||[]); }catch(e){ return []; } }

        async function refresh(){
            $('storesLoading').classList.add('on');
            const stores=await fetchStores();
            window.__stores=stores;
            const grid=$('storesGrid');
            if(!stores.length){ grid.innerHTML='<div class="empty"><i class="fas fa-store"></i><h3>No stores yet</h3><p>Create your first digital store to start selling.</p><button onclick="document.getElementById(\'openModalBtn\').click()" class="btn" style="margin-top:1.2rem"><i class="fas fa-plus"></i> Create your first store</button></div>'; $('storesLoading').classList.remove('on'); tiles=[]; return; }
            grid.innerHTML=stores.map(s=>{ const c=normC(s.countries_of_operation); const tv=typeof s.total_value!=='undefined'?s.total_value:0;
                return `<div class="store" data-name="${(s.name||'').toLowerCase()}" data-countries="${c.join('|').toLowerCase()}" data-verified="${s.is_verified?'verified':'not_verified'}">
                    <div style="display:flex;align-items:flex-start;gap:.8rem;margin-bottom:1rem">
                        <div class="savatar"><i class="fas fa-store"></i></div>
                        <h3 style="flex:1;font-size:1.25rem;font-weight:800;margin:.2rem 0">${s.name||''}</h3>
                        ${s.is_verified?'<span class="badge b-v"><i class="fas fa-check-circle"></i>Verified</span>':'<span class="badge b-p">Pending</span>'}
                    </div>
                    <div class="srow"><i class="fas fa-user"></i><span>${s.owner_name||'—'}</span></div>
                    <div class="srow"><i class="fas fa-envelope"></i><span>${s.owner_email||'—'}</span></div>
                    <div class="srow"><i class="fas fa-phone"></i><span>${s.owner_phone||'—'}</span></div>
                    <div class="srow"><i class="fas fa-globe"></i><span>${c.join(', ')||'Not specified'}</span></div>
                    <div class="srow"><i class="fas fa-dollar-sign"></i><strong style="color:var(--g700)">$${Number(tv).toLocaleString()}</strong></div>
                    <a href="digital_store.html?id=${s.id}" class="manage"><i class="fas fa-cog"></i> Manage Store</a>
                </div>`;
            }).join('');
            tiles=Array.from(grid.getElementsByClassName('store')); filter(); $('storesLoading').classList.remove('on');
        }

        $('searchInput').addEventListener('input', filter);
        $('verificationFilter').addEventListener('change', filter);

        const modal=$('modal');
        $('openModalBtn').addEventListener('click', async ()=>{ modal.classList.add('show');
            if(token){ try{ const r=await fetch('/api/users/me/',{headers:{'Authorization':'Bearer '+token}}); if(r.ok){ const u=await r.json(); if(!$('ownerName').value) $('ownerName').value=u.username||''; if(!$('ownerEmail').value) $('ownerEmail').value=u.email||''; if(!$('ownerPhone').value) $('ownerPhone').value=u.phone||''; } }catch(e){} }
        });
        $('cancelBtn').addEventListener('click', ()=> modal.classList.remove('show'));
        modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('show'); });

        $('createStoreForm').addEventListener('submit', async e=>{
            e.preventDefault();
            const countries=( $('countries').value||'').split(',').map(s=>s.trim()).filter(Boolean);
            const payload={ name:$('name').value, owner_name:$('ownerName').value||currentUser.name, owner_phone:$('ownerPhone').value||'', owner_email:$('ownerEmail').value||currentUser.email, description:$('description').value||'', countries_of_operation:countries, is_verified:$('isVerified').checked };
            try{ const r=await fetch('/api/stores/',{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify(payload) });
                if(!r.ok){ alert('Failed to create store. Please check your input.'); return; }
                modal.classList.remove('show'); e.target.reset(); refresh();
            }catch(e){ alert('An error occurred. Please try again.'); }
        });

        /* Dale context */
        window.__daleCtx = function(){ const s=(window.__stores||[]).map(x=>({name:x.name, verified:x.is_verified, countries:normC(x.countries_of_operation), value:x.total_value})); return { page:'Digital Store', type:'digital_stores', user:{name:currentUser.name}, extras:{ store_count:s.length, stores:s } }; };
        window.__daleIntro = "Hi, I'm Dale. Ask me about your stores, how to get verified, or what to sell next.";
        window.__daleChips = ["How do I get my store verified?","What should I sell?","Summarise my stores","Tips to grow sales"];

        document.addEventListener('DOMContentLoaded', ()=>{ if(!sessionOk()) return; refresh(); });
    </script>
    <!-- ===== Dale AI assistant (context-aware, brand) ===== -->
    <script>
    (function(){
      if (window.__daleInit) return; window.__daleInit = true;
      var ENDPOINT = '/api/ai/dale/ask/';
      var history = [];

      var css = ''
        + '#daleFab{position:fixed;right:1.4rem;bottom:1.4rem;width:62px;height:62px;border:0;border-radius:50%;cursor:pointer;z-index:1000;'
        + 'background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 12px 30px -8px rgba(5,120,80,.6);'
        + 'display:grid;place-items:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}'
        + '#daleFab:hover{transform:scale(1.08) rotate(-6deg);box-shadow:0 18px 40px -8px rgba(5,120,80,.7)}'
        + '#daleFab svg{width:28px;height:28px}'
        + '#daleFab .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#fde047;box-shadow:0 0 0 2px #047857}'
        + '#dalePanel{position:fixed;right:1.4rem;bottom:6.4rem;width:380px;max-width:calc(100vw - 2rem);height:560px;max-height:calc(100vh - 8rem);z-index:1000;'
        + 'background:#fffdf8;border:1px solid #ece4d6;border-radius:22px;box-shadow:0 30px 70px -20px rgba(6,28,15,.5);'
        + 'display:none;flex-direction:column;overflow:hidden;font-family:Inter,system-ui,sans-serif}'
        + '#dalePanel.open{display:flex;animation:daleUp .28s cubic-bezier(.2,.8,.2,1)}'
        + '@keyframes daleUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}'
        + '.dale-head{display:flex;align-items:center;gap:.7rem;padding:1rem 1.1rem;color:#fff;background:linear-gradient(135deg,#0c6b46,#065f3c)}'
        + '.dale-head .mk{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}'
        + '.dale-head .mk svg{width:20px;height:20px}'
        + '.dale-head h4{margin:0;font-family:Fraunces,serif;font-weight:700;font-size:1.1rem;line-height:1.1}'
        + '.dale-head p{margin:0;font-size:.74rem;color:rgba(255,255,255,.8)}'
        + '.dale-head .x{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.85);font-size:1.4rem;cursor:pointer;line-height:1;padding:.2rem}'
        + '.dale-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem;background:#fbf7ee}'
        + '.dale-b{max-width:84%;padding:.7rem .85rem;border-radius:14px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}'
        + '.dale-b.ai{align-self:flex-start;background:#fff;border:1px solid #ece4d6;color:#16271c;border-bottom-left-radius:4px}'
        + '.dale-b.me{align-self:flex-end;background:linear-gradient(135deg,#10b981,#047857);color:#fff;border-bottom-right-radius:4px}'
        + '.dale-b.err{align-self:flex-start;background:#fdeaea;border:1px solid #f6c9c9;color:#b0322c}'
        + '.dale-typing{align-self:flex-start;display:inline-flex;gap:4px;padding:.8rem .9rem;background:#fff;border:1px solid #ece4d6;border-radius:14px}'
        + '.dale-typing i{width:7px;height:7px;border-radius:50%;background:#9fb3a6;animation:daleBlink 1.2s infinite}'
        + '.dale-typing i:nth-child(2){animation-delay:.2s}.dale-typing i:nth-child(3){animation-delay:.4s}'
        + '@keyframes daleBlink{0%,60%,100%{opacity:.3}30%{opacity:1}}'
        + '.dale-chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem 1rem 0}'
        + '.dale-chip{font-size:.78rem;font-weight:600;color:#0f7a4b;background:#e7f4ec;border:1px solid #cdead8;border-radius:999px;padding:.35rem .7rem;cursor:pointer;transition:background .15s}'
        + '.dale-chip:hover{background:#d6efdf}'
        + '.dale-input{display:flex;gap:.5rem;padding:.8rem 1rem 1rem;border-top:1px solid #ece4d6;background:#fffdf8}'
        + '.dale-input textarea{flex:1;resize:none;border:1.5px solid #e2ddd0;border-radius:12px;padding:.6rem .8rem;font:inherit;font-size:.9rem;max-height:90px;outline:none}'
        + '.dale-input textarea:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12)}'
        + '.dale-input button{flex:none;width:44px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#10b981,#047857);color:#fff;display:grid;place-items:center}'
        + '.dale-input button svg{width:18px;height:18px}'
        + '@media(max-width:480px){#dalePanel{right:.6rem;left:.6rem;width:auto;bottom:5.6rem;height:70vh}}';
      var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

      var leaf = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>';
      var fab = document.createElement('button'); fab.id='daleFab'; fab.title='Ask Dale AI';
      fab.innerHTML = '<span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>';
      document.body.appendChild(fab);

      var panel = document.createElement('div'); panel.id='dalePanel';
      panel.innerHTML =
        '<div class="dale-head"><div class="mk">'+leaf+'</div><div><h4>Dale</h4><p>Your Agricore assistant</p></div><button class="x" aria-label="Close">&times;</button></div>'
        + '<div class="dale-msgs" id="daleMsgs"></div>'
        + '<div class="dale-chips" id="daleChips"></div>'
        + '<div class="dale-input"><textarea id="daleText" rows="1" placeholder="Ask Dale anything..."></textarea>'
        + '<button id="daleSend" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>';
      document.body.appendChild(panel);

      var msgs = panel.querySelector('#daleMsgs');
      var text = panel.querySelector('#daleText');
      var greeted = false;

      function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
      function bubble(content, cls){ var d=document.createElement('div'); d.className='dale-b '+cls; d.innerHTML=esc(content); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }
      function typing(){ var d=document.createElement('div'); d.className='dale-typing'; d.innerHTML='<i></i><i></i><i></i>'; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }

      function ctx(){ try { return (typeof window.__daleCtx==='function' ? (window.__daleCtx()||{}) : {}); } catch(e){ return {}; } }

      function renderChips(){
        var chips = (window.__daleChips || []);
        var box = panel.querySelector('#daleChips'); box.innerHTML='';
        chips.forEach(function(c){ var b=document.createElement('button'); b.className='dale-chip'; b.textContent=c; b.onclick=function(){ send(c); }; box.appendChild(b); });
      }

      async function send(q){
        q = (q!==undefined ? q : text.value).trim();
        if(!q) return;
        text.value=''; bubble(q,'me'); history.push({role:'user',content:q});
        var t = typing();
        try{
          var token = localStorage.getItem('access_token');
          var res = await fetch(ENDPOINT, {
            method:'POST',
            headers: Object.assign({'Content-Type':'application/json'}, token ? {'Authorization':'Bearer '+token} : {}),
            body: JSON.stringify({ prompt:q, context: ctx(), history: history.slice(-8) })
          });
          t.remove();
          if(!res.ok){ bubble(res.status===401 ? 'Please log in again to use Dale.' : 'Dale had trouble answering. Try again.', 'err'); return; }
          var data = await res.json();
          var reply = data.reply || data.detail || 'No response.';
          bubble(reply,'ai'); history.push({role:'assistant',content:reply});
        }catch(e){ t.remove(); bubble('Network error reaching Dale. Check your connection.', 'err'); }
      }

      function open(){
        panel.classList.add('open');
        if(!greeted){ greeted=true; bubble(window.__daleIntro || "Hi, I'm Dale. How can I help with this page?", 'ai'); renderChips(); }
        setTimeout(function(){ text.focus(); }, 50);
      }
      function close(){ panel.classList.remove('open'); }

      fab.addEventListener('click', function(){ panel.classList.contains('open') ? close() : open(); });
      panel.querySelector('.x').addEventListener('click', close);
      panel.querySelector('#daleSend').addEventListener('click', function(){ send(); });
      text.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
      text.addEventListener('input', function(){ text.style.height='auto'; text.style.height=Math.min(text.scrollHeight,90)+'px'; });
    })();
    </script>

</body>
</html>
