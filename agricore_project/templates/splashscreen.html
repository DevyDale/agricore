{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agricore Solutions - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.5/dist/dotlottie-wc.js" type="module"></script>

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            position: relative;
        }

        /* Animated background elements */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            top: -10%;
            right: -5%;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #10b981, #059669);
            animation-delay: 0s;
        }

        body::after {
            bottom: -15%;
            left: -10%;
            width: 800px;
            height: 800px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* Main container */
        .splash-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Content container with glassmorphism */
        .splash-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            max-width: 680px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: slideUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .splash-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #059669);
            border-radius: 2rem 2rem 0 0;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Lottie animation container */
        .lottie-box {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            position: relative;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        dotlottie-wc {
            display: block;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 20px rgba(16, 185, 129, 0.2));
        }

        /* Logo/Brand section */
        .brand-section {
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            animation: fadeIn 1s ease-out 0.5s both;
        }

        .brand-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .brand-subtitle {
            font-size: 1.125rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 1.5rem;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        /* Tagline */
        .tagline {
            font-size: 1.0625rem;
            line-height: 1.7;
            color: #475569;
            margin-bottom: 2rem;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        /* CTA Button */
        .get-started-btn {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-size: 1.125rem;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: block;
            margin: 0 auto;
            animation: fadeIn 1s ease-out 0.9s both;
            position: relative;
            overflow: hidden;
        }

        .get-started-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .get-started-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .get-started-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(16, 185, 129, 0.5);
        }

        .get-started-btn span {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Feature badges */
        .feature-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
            animation: fadeIn 1s ease-out 1s both;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.5rem 1rem;
            background: #f0fdf4;
            border: 1px solid #dcfce7;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #166534;
        }

        .badge i {
            font-size: 0.875rem;
        }

        /* Fade out animation */
        .fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .splash-wrapper {
                padding: 1.5rem;
            }

            .splash-content {
                padding: 2.5rem 1.5rem;
            }

            .brand-title {
                font-size: 2.25rem;
            }

            .brand-subtitle {
                font-size: 1rem;
            }

            .tagline {
                font-size: 0.9375rem;
                margin-bottom: 1.5rem;
            }

            .lottie-box {
                width: 160px;
                height: 160px;
            }

            .get-started-btn {
                font-size: 1rem;
                padding: 0.875rem 1.5rem;
            }

            .feature-badges {
                gap: 0.5rem;
            }

            .badge {
                font-size: 0.75rem;
                padding: 0.375rem 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .splash-wrapper {
                padding: 1rem;
            }

            .splash-content {
                padding: 2rem 1.25rem;
                border-radius: 1.5rem;
            }

            .brand-title {
                font-size: 2rem;
            }

            .lottie-box {
                width: 140px;
                height: 140px;
                margin-bottom: 1.5rem;
            }

            .brand-icon {
                width: 56px;
                height: 56px;
            }

            .brand-icon svg {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-wrapper">
        <div class="splash-content">
            <!-- Lottie Animation -->
            <div class="lottie-box">
                <dotlottie-wc
                    src="https://lottie.host/2c27ca81-5cda-4281-92e8-d4f0407b5cab/doZJqbW664.lottie"
                    autoplay
                    loop>
                </dotlottie-wc>
            </div>

            <!-- Brand Section -->
            <div class="brand-section">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 18.5c-3.82-.93-6.5-4.65-6.5-8.5V8.41l6.5-3.41 6.5 3.41V12c0 3.85-2.68 7.57-6.5 8.5z"/>
                        <path d="M9.5 11.5l2 2 4-4"/>
                    </svg>
                </div>
                <h1 class="brand-title">Agricore</h1>
                <p class="brand-subtitle">Smart Farming Solutions</p>
            </div>

            <!-- Tagline -->
            <p class="tagline">
                Your complete agricultural marketplace platform. Connect farms with buyers, manage produce, 
                hire professionals, and get AI-powered insights—all in one place.
            </p>

            <!-- CTA Button -->
            <button class="get-started-btn" onclick="redirectToOnboarding()">
                <span>
                    Get Started
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </button>

            <!-- Feature Badges -->
            <div class="feature-badges">
                <span class="badge">
                    <i class="fas fa-check-circle"></i>
                    Free to Start
                </span>
                <span class="badge">
                    <i class="fas fa-shield-alt"></i>
                    Secure Platform
                </span>
                <span class="badge">
                    <i class="fas fa-users"></i>
                    Join 10,000+ Farmers
                </span>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script>
        function redirectToOnboarding() {
            const splash = document.querySelector('.splash-wrapper');
            setTimeout(() => {
                splash.classList.add('fade-out');
            }, 50);
            setTimeout(() => {
                window.location.href = '/onboarding/';
            }, 850);
        }

        // Prevent back navigation to splash
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.href);
        }
    </script>
</body>
</html>
