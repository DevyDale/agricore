{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-6 text-emerald-700">Login</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label for="username" class="block mb-2 font-semibold">Username</label>
      <input type="text" name="username" id="username" class="w-full px-4 py-2 border rounded" required>
    </div>
    <div class="mb-6">
      <label for="password" class="block mb-2 font-semibold">Password</label>
      <input type="password" name="password" id="password" class="w-full px-4 py-2 border rounded" required>
    </div>
    <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">Login</button>
  </form>
</div>
{% endblock %}
