<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Farms — Agricore</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{ --g500:#10b981; --g600:#059669; --g700:#047857; --g900:#064e3b; --line:#ece4d6; --ink:#16271c; }
        *{ box-sizing:border-box; font-family:'Inter',system-ui,sans-serif }
        h1,h2,h3,.fr{ font-family:'Fraunces',serif; letter-spacing:-.01em }
        body{ margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(130% 100% at 50% -10%, #fffdf8 0%, #f4efe3 62%) }

        /* farmland hero header */
        .hero{ position:relative; overflow:hidden; background:#22432c; color:#fff }
        #farmland{ position:absolute; inset:-2% } #farmland svg{ width:100%; height:100% }
        .hero-ov{ position:absolute; inset:0; background:linear-gradient(100deg, rgba(8,30,18,.86) 0%, rgba(8,30,18,.55) 60%, rgba(8,30,18,.3) 100%) }
        .hero-in{ position:relative; z-index:2; max-width:1500px; margin:0 auto; padding:1rem 1.5rem 1.6rem }
        .topbar{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap }
        .brand{ display:flex; align-items:center; gap:.6rem; font-family:Fraunces; font-weight:800; font-size:1.3rem }
        .brand .mk{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28) }
        .nav{ margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center }
        .nbtn{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); color:#fff; padding:.5rem .85rem; border-radius:999px; font-size:.84rem; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; gap:.4rem }
        .nbtn:hover{ background:rgba(255,255,255,.22); transform:translateY(-1px) }
        .nbtn.out{ background:linear-gradient(135deg,#f87171,#ef4444); border-color:transparent }
        h1.title{ font-size:clamp(2rem,5vw,3rem); font-weight:900; margin:1.2rem 0 .2rem; drop-shadow:0 2px 8px rgba(0,0,0,.3) }
        .sub{ color:rgba(255,255,255,.86); font-size:1.05rem }

        main{ max-width:1500px; margin:0 auto; padding:1.6rem 1.5rem 4rem }
        .card{ background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 36px -26px rgba(20,40,25,.5) }
        .controls{ display:flex; gap:.7rem; flex-wrap:wrap; align-items:center; padding:1rem 1.1rem; margin-bottom:1.4rem }
        .field{ background:#fff; border:1.5px solid #e2ddd0; border-radius:12px; padding:.7rem .95rem; font-size:.92rem; color:#1e293b; transition:all .2s }
        .field:focus{ outline:none; border-color:var(--g500); box-shadow:0 0 0 3px rgba(16,185,129,.12) }
        .grow{ flex:1; min-width:200px }
        .btn{ background:linear-gradient(135deg,var(--g500),var(--g700)); color:#fff; font-weight:700; padding:.7rem 1.3rem; border:0; border-radius:12px; font-size:.92rem; cursor:pointer; transition:all .25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 6px 16px -6px rgba(5,120,80,.5); display:inline-flex; align-items:center; gap:.5rem; white-space:nowrap }
        .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 24px -8px rgba(5,120,80,.6) }

        .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.4rem }
        .farm{ background:#fff; border:1px solid var(--line); border-left:5px solid var(--g500); border-radius:16px; padding:1.5rem; position:relative; transition:all .3s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 22px -18px rgba(20,40,25,.5) }
        .farm:hover{ transform:translateY(-6px); box-shadow:0 18px 40px -20px rgba(5,120,80,.45) }
        .farm h3{ font-size:1.35rem; font-weight:800; margin:.1rem 0 .6rem }
        .tbadge{ display:inline-flex; align-items:center; gap:.35rem; padding:.3rem .8rem; border-radius:999px; font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.7rem }
        .t-crops{ background:#dcfce7; color:#166534 } .t-livestock{ background:#fef3c7; color:#92400e } .t-mixed{ background:#dbeafe; color:#1e40af }
        .farm p{ color:#64748b; display:flex; align-items:center; gap:.55rem; margin:.4rem 0; font-size:.92rem }
        .farm p i{ color:var(--g600); width:18px }
        .note{ background:#f0fdf4; border-left:3px solid var(--g500); border-radius:10px; padding:.6rem .8rem; margin:.7rem 0; color:#166534; font-size:.88rem }
        .acts{ display:flex; gap:.5rem; margin-top:1.1rem; padding-top:1.1rem; border-top:1px solid #f1ece1; flex-wrap:wrap }
        .cbtn{ flex:1; min-width:72px; padding:.6rem .8rem; border-radius:10px; font-size:.82rem; font-weight:600; cursor:pointer; border:1.5px solid transparent; transition:all .2s; display:inline-flex; align-items:center; justify-content:center; gap:.35rem }
        .c-edit{ background:#f6f1e6; color:#5b6b60; border-color:var(--line) } .c-edit:hover{ background:#ece4d6 }
        .c-manage{ background:linear-gradient(135deg,var(--g500),var(--g700)); color:#fff } .c-manage:hover{ transform:translateY(-1px) }
        .c-del{ position:absolute; top:1rem; right:1rem; width:34px; height:34px; border-radius:10px; background:#fee2e2; color:#dc2626; border:0; cursor:pointer }
        .c-del:hover{ background:#fecaca }

        .empty{ grid-column:1/-1; text-align:center; padding:4rem 2rem; background:#fbf7ee; border:2px dashed var(--line); border-radius:18px }
        .empty i{ font-size:3.4rem; color:#cbd5c5; margin-bottom:1rem }
        .empty h3{ font-size:1.4rem; color:#475569 } .empty p{ color:#64748b }

        .modal{ display:none; position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(6px); z-index:1000; padding:1rem; overflow-y:auto }
        .modal.show{ display:flex; align-items:center; justify-content:center }
        .mc{ background:#fff; border:1px solid var(--line); border-radius:20px; padding:2rem; width:100%; max-width:640px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 70px -20px rgba(6,28,15,.5); margin:auto }
        .mc h2{ font-size:1.6rem; font-weight:800; margin:0 0 1.3rem; padding-bottom:.9rem; border-bottom:2px solid #f1ece1 }
        label{ display:block; font-weight:600; color:#475569; font-size:.86rem; margin-bottom:.4rem }
        .fg{ display:grid; grid-template-columns:1fr 1fr; gap:1rem } .fg .full{ grid-column:1/-1 }
        .fg .field, .mc .field{ width:100% }
        .mf{ display:flex; justify-content:flex-end; gap:.7rem; margin-top:1.5rem; padding-top:1rem; border-top:1px solid #f1ece1; flex-wrap:wrap }
        .mbtn{ padding:.75rem 1.4rem; border-radius:12px; font-weight:600; cursor:pointer; border:0 }
        .mb-cancel{ background:#f6f1e6; color:#5b6b60; border:1.5px solid var(--line) }
        .mb-save{ background:linear-gradient(135deg,var(--g500),var(--g700)); color:#fff }
        #form-error{ background:#fee2e2; border:1px solid #fca5a5; color:#dc2626; border-radius:12px; padding:.85rem; margin-bottom:1rem }

        #snack{ position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:#2c2f36; color:#fff; padding:.9rem 1.2rem; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.25); display:none; align-items:center; gap:1rem; z-index:1100 }
        #snack button{ background:var(--g500); color:#fff; border:0; padding:.45rem 1rem; border-radius:9px; font-weight:600; cursor:pointer }
        .spin{ display:none; justify-content:center; padding:3rem } .spin.on{ display:flex }
        .sp{ width:3rem; height:3rem; border:3px solid var(--line); border-top-color:var(--g500); border-radius:50%; animation:spin 1s linear infinite }
        @keyframes spin{ to{ transform:rotate(360deg) } }
        @media(max-width:620px){ .fg{ grid-template-columns:1fr } .nav .lbl{ display:none } }
    </style>
</head>
<body>
    <header class="hero">
        <div id="farmland"></div><div class="hero-ov"></div>
        <div class="hero-in">
            <div class="topbar">
                <div class="brand"><span class="mk"><i class="fas fa-tractor"></i></span> Agricore</div>
                <nav class="nav">
                    <a href="marketplace.html" class="nbtn"><i class="fas fa-store"></i><span class="lbl">Marketplace</span></a>
                    <a href="digitalstores.html" class="nbtn"><i class="fas fa-shopping-cart"></i><span class="lbl">My Stores</span></a>
                    <a href="chats.html" class="nbtn"><i class="fas fa-comments"></i><span class="lbl">Chats</span></a>
                    <a href="workforce.html" class="nbtn"><i class="fas fa-briefcase"></i><span class="lbl">Network</span></a>
                    <button id="settings-btn" class="nbtn"><i class="fas fa-cog"></i><span class="lbl">Settings</span></button>
                    <button id="logout-btn" class="nbtn out"><i class="fas fa-sign-out-alt"></i><span class="lbl">Log out</span></button>
                </nav>
            </div>
            <h1 class="title">Your Farms</h1>
            <p class="sub">Every field, herd and harvest — in one place.</p>
        </div>
    </header>

    <main>
        <div class="card controls">
            <input type="text" id="farm-search" placeholder="Search farms..." class="field grow">
            <select id="farm-filter" class="field">
                <option value="">All types</option>
                <option value="crops">Crops</option>
                <option value="livestock">Livestock</option>
                <option value="mixed">Mixed</option>
            </select>
            <button id="create-farm-btn" class="btn"><i class="fas fa-plus"></i> Add Farm</button>
        </div>

        <div id="spinner" class="spin"><div class="sp"></div></div>
        <div id="farms-list" class="grid"></div>
    </main>

    <!-- Farm Modal -->
    <div id="farm-modal" class="modal">
        <div class="mc">
            <h2 id="farm-modal-title">Add New Farm</h2>
            <form id="farm-form">
                <div id="form-error" style="display:none"></div>
                <div class="fg">
                    <div><label>Farm Name *</label><input id="f-name" class="field" placeholder="e.g. Green Acres"></div>
                    <div><label>Farm Type *</label><select id="f-type" class="field"><option value="">Select type</option><option value="crops">Crops</option><option value="livestock">Livestock</option><option value="mixed">Mixed</option></select></div>
                    <div><label>Country *</label><input id="f-country" class="field" placeholder="Country"></div>
                    <div><label>State / Province *</label><input id="f-state" class="field" placeholder="State"></div>
                    <div><label>City *</label><input id="f-city" class="field" placeholder="City"></div>
                    <div><label>Address</label><input id="f-address" class="field" placeholder="Street address"></div>
                    <div><label>Total Size *</label><input id="f-size" type="number" step="0.01" min="0" class="field" placeholder="e.g. 150"></div>
                    <div><label>Size Unit</label><select id="f-unit" class="field"><option value="acres">acres</option><option value="hectares">hectares</option><option value="square_meters">square meters</option></select></div>
                    <div class="full"><label>Additional Notes</label><textarea id="f-notes" class="field" rows="3" placeholder="Soil type, main crops, livestock..."></textarea></div>
                </div>
                <div class="mf">
                    <button type="button" id="f-cancel" class="mbtn mb-cancel">Cancel</button>
                    <button type="submit" class="mbtn mb-save">Save Farm</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="mc" style="max-width:440px">
            <h2>Settings</h2>
            <div style="margin-bottom:1.2rem"><label>Language</label>
                <select id="set-language" class="field"><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option><option value="sw">Kiswahili</option><option value="ar">العربية</option></select></div>
            <div style="margin-bottom:1.2rem"><label>Currency</label>
                <select id="set-currency" class="field"><option value="USD">USD ($)</option><option value="NGN">NGN (₦)</option><option value="KES">KES (KSh)</option><option value="GHS">GHS (₵)</option><option value="ZAR">ZAR (R)</option><option value="EUR">EUR (€)</option></select></div>
            <div class="mf"><button type="button" id="set-close" class="mbtn mb-cancel">Close</button></div>
        </div>
    </div>

    <div id="snack"></div>

    <script>
        /* farmland hero */
        (function(){ function bf(){var W=1200,H=560,cols=7,rows=4,jx=(W/cols)*.32,jy=(H/rows)*.32,P=[];for(var r=0;r<=rows;r++){P[r]=[];for(var c=0;c<=cols;c++){var e=(r===0||r===rows||c===0||c===cols);P[r][c]={x:(c/cols)*W+(e?0:(Math.random()*2-1)*jx),y:(r/rows)*H+(e?0:(Math.random()*2-1)*jy)};}}var pal=[['#2f5a34','#27502c'],['#3c7a3c','#336a33'],['#4f8438','#447730'],['#6f8d3f','#637f37'],['#8a9a4e','#7c8c42'],['#c39a48','#b58b3c'],['#d3ab57','#c59b48'],['#b15a36','#9f4e2e'],['#cdb878','#bda863']],ang=[0,16,90,74,16,0,90,30,16],defs='';pal.forEach(function(c,i){defs+='<pattern id="cp'+i+'" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate('+ang[i]+')"><rect width="9" height="9" fill="'+c[0]+'"/><rect width="9" height="3.4" fill="'+c[1]+'"/></pattern>';});var bag=[0,0,1,1,1,2,2,2,3,3,4,4,5,5,6,7,8],cells='';for(var r2=0;r2<rows;r2++)for(var c2=0;c2<cols;c2++){var a=P[r2][c2],b=P[r2][c2+1],d=P[r2+1][c2+1],e2=P[r2+1][c2],fi=bag[Math.floor(Math.random()*bag.length)];cells+='<polygon points="'+a.x.toFixed(1)+','+a.y.toFixed(1)+' '+b.x.toFixed(1)+','+b.y.toFixed(1)+' '+d.x.toFixed(1)+','+d.y.toFixed(1)+' '+e2.x.toFixed(1)+','+e2.y.toFixed(1)+'" fill="url(#cp'+fi+')" stroke="rgba(22,15,7,.16)" stroke-width="1.2"/>';}return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>'+defs+'</defs>'+cells+'</svg>';}var el=document.getElementById('farmland'); if(el) el.innerHTML=bf(); })();

        const token = localStorage.getItem('access_token');
        if(!token || token==='null') window.location.href='authentication.html';

        function decodeJWT(t){ try{ return JSON.parse(decodeURIComponent(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); }catch(e){ return null; } }
        let currentUser = { name:'User' };
        const dec = token && decodeJWT(token);
        if(dec) currentUser = { name: dec.name||dec.full_name||dec.username||'User', email: dec.email||'', id: dec.user_id||dec.id||null };

        let editingId = null;
        window.userFarmsContext = [];
        const $ = id => document.getElementById(id);

        async function loadFarms(){
            const list = $('farms-list'), spin = $('spinner');
            spin.classList.add('on'); list.innerHTML='';
            try{
                const res = await fetch('/api/farms/', { headers:{'Authorization':'Bearer '+token} });
                if(res.status===401){ localStorage.clear(); window.location.href='authentication.html'; return; }
                if(!res.ok) throw new Error();
                let farms = await res.json(); farms = Array.isArray(farms)?farms:(farms.results||[]);
                window.userFarmsContext = farms;
                const q = $('farm-search').value.trim().toLowerCase(), t = $('farm-filter').value;
                let view = farms.filter(f => (!q || (f.name||'').toLowerCase().includes(q)) && (!t || (f.type||'').toLowerCase()===t));
                spin.classList.remove('on');
                if(!view.length){ list.innerHTML='<div class="empty"><i class="fas fa-tractor"></i><h3>No farms found</h3><p>'+(farms.length?'Try a different search or filter.':'Add your first farm to get started.')+'</p></div>'; return; }
                list.innerHTML = view.map(f=>{
                    const tc = f.type==='crops'?'t-crops':f.type==='livestock'?'t-livestock':'t-mixed';
                    return `<div class="farm">
                        <button class="c-del" onclick="deleteFarm(${f.id})" title="Delete"><i class="fas fa-trash"></i></button>
                        <span class="tbadge ${tc}"><i class="fas fa-leaf"></i> ${f.type?f.type[0].toUpperCase()+f.type.slice(1):''}</span>
                        <h3>${f.name||''}</h3>
                        <p><i class="fas fa-map-marker-alt"></i> ${f.city||''}${f.country?', '+f.country:''}</p>
                        <p><i class="fas fa-ruler-combined"></i> ${f.total_size||''} ${f.size_unit||''}</p>
                        ${f.additional_notes?`<div class="note"><i class="fas fa-info-circle"></i> ${f.additional_notes}</div>`:''}
                        <div class="acts">
                            <button class="cbtn c-edit" onclick="editFarm(${f.id})"><i class="fas fa-edit"></i>Edit</button>
                            <button class="cbtn c-manage" onclick="window.location.href='individual_farm.html?id=${f.id}'"><i class="fas fa-cog"></i>Manage</button>
                        </div></div>`;
                }).join('');
            }catch(e){ spin.classList.remove('on'); list.innerHTML='<div class="empty" style="background:#fef2f2;border-color:#fca5a5"><i class="fas fa-exclamation-triangle" style="color:#dc2626"></i><h3>Couldn\'t load farms</h3><p>Check your connection and try again.</p></div>'; }
        }
        $('farm-search').addEventListener('input', loadFarms);
        $('farm-filter').addEventListener('change', loadFarms);

        $('create-farm-btn').addEventListener('click', ()=>{
            editingId=null; $('farm-modal-title').textContent='Add New Farm'; $('farm-form').reset(); $('f-unit').value='acres'; $('form-error').style.display='none'; $('farm-modal').classList.add('show');
        });
        $('f-cancel').addEventListener('click', ()=> $('farm-modal').classList.remove('show'));

        $('farm-form').addEventListener('submit', async e=>{
            e.preventDefault();
            const sv=$('f-size').value.trim(); const size = sv===''?null:parseFloat(sv);
            const data = { name:$('f-name').value.trim(), type:$('f-type').value.trim().toLowerCase(), country:$('f-country').value.trim(), state:$('f-state').value.trim(), city:$('f-city').value.trim(), address:$('f-address').value.trim(), total_size:size, size_unit:$('f-unit').value.trim(), additional_notes:$('f-notes').value.trim() };
            const err=$('form-error');
            if(!data.name||!data.type||!data.country||!data.state||!data.city){ err.textContent='Please fill all fields marked with *'; err.style.display='block'; return; }
            try{
                const url = editingId?`/api/farms/${editingId}/`:'/api/farms/';
                const res = await fetch(url, { method: editingId?'PATCH':'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify(data) });
                if(!res.ok){ const txt=await res.text(); let j=null; try{j=JSON.parse(txt);}catch(_){} err.textContent = j?Object.entries(j).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(', '):v}`).join('\n'):(res.statusText||txt); err.style.display='block'; return; }
                $('farm-modal').classList.remove('show'); loadFarms();
            }catch(_){ err.textContent='Failed to save farm. Please try again.'; err.style.display='block'; }
        });

        window.editFarm = async id=>{
            event?.stopPropagation();
            let farm = window.userFarmsContext.find(f=>f.id===id);
            try{ const res=await fetch(`/api/farms/${id}/`,{headers:{'Authorization':'Bearer '+token}}); if(res.ok) farm=await res.json(); }catch(_){}
            if(!farm) return;
            editingId=id; $('farm-modal-title').textContent='Edit Farm: '+farm.name;
            $('f-name').value=farm.name||''; $('f-type').value=farm.type||''; $('f-country').value=farm.country||''; $('f-state').value=farm.state||''; $('f-city').value=farm.city||''; $('f-address').value=farm.address||''; $('f-size').value=farm.total_size||''; $('f-unit').value=farm.size_unit||'acres'; $('f-notes').value=farm.additional_notes||'';
            $('form-error').style.display='none'; $('farm-modal').classList.add('show');
        };

        let lastDeleted=null;
        window.deleteFarm = async id=>{
            event?.stopPropagation();
            if(!confirm('Delete this farm? This cannot be undone.')) return;
            const farm = window.userFarmsContext.find(f=>f.id===id);
            try{
                const res = await fetch(`/api/farms/${id}/`, { method:'DELETE', headers:{'Authorization':'Bearer '+token} });
                if(res.ok){ lastDeleted={data:farm}; loadFarms(); snackbar(`Farm "${farm?.name||''}" deleted`, async ()=>{
                    if(!lastDeleted) return; const d=Object.assign({},lastDeleted.data); delete d.id;
                    try{ await fetch('/api/farms/',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(d)}); loadFarms(); }catch(_){}
                    lastDeleted=null;
                }); }
                else alert('Failed to delete farm.');
            }catch(_){ alert('Error deleting farm.'); }
        };
        function snackbar(msg,onUndo){ const b=$('snack'); b.innerHTML=`<span>${msg}</span><button>Undo</button>`; b.style.display='flex'; b.querySelector('button').onclick=()=>{ onUndo&&onUndo(); b.style.display='none'; }; setTimeout(()=>b.style.display='none',8000); }

        /* settings */
        $('settings-btn').addEventListener('click', ()=> $('settings-modal').classList.add('show'));
        $('set-close').addEventListener('click', ()=> $('settings-modal').classList.remove('show'));
        $('logout-btn').addEventListener('click', ()=>{ localStorage.clear(); window.location.href='authentication.html'; });
        (function(){ const lang=localStorage.getItem('preferred_language')||'en', cur=localStorage.getItem('preferred_currency')||'USD'; $('set-language').value=lang; $('set-currency').value=cur; })();
        function syncSettings(){ const d={ language:$('set-language').value, currency:$('set-currency').value }; localStorage.setItem('preferred_language',d.language); localStorage.setItem('preferred_currency',d.currency); fetch('/api/user/settings/',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(d)}).catch(()=>{}); }
        $('set-language').addEventListener('change', syncSettings);
        $('set-currency').addEventListener('change', syncSettings);

        document.querySelectorAll('.modal').forEach(m=> m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('show'); }));

        /* Dale context for this page */
        window.__daleCtx = function(){ const farms=(window.userFarmsContext||[]).map(f=>({name:f.name,type:f.type,size:(f.total_size||'')+' '+(f.size_unit||''),location:[f.city,f.country].filter(Boolean).join(', ')})); return { page:'Multi-Farm Dashboard', type:'multi_farm', farms:farms, user:{name:currentUser.name}, extras:{ farm_count:farms.length } }; };
        window.__daleIntro = "Hi, I'm Dale. I can see your farms — ask me to compare them, summarise your land, or suggest what to focus on next.";
        window.__daleChips = ["How many farms do I have?","Which is my largest farm?","Summarise my farms","What should I prioritise?"];

        loadFarms();
    </script>
    <!-- ===== Dale AI assistant (context-aware, brand) ===== -->
    <script>
    (function(){
      if (window.__daleInit) return; window.__daleInit = true;
      var ENDPOINT = '/api/ai/dale/ask/';
      var history = [];

      var css = ''
        + '#daleFab{position:fixed;right:1.4rem;bottom:1.4rem;width:62px;height:62px;border:0;border-radius:50%;cursor:pointer;z-index:1000;'
        + 'background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 12px 30px -8px rgba(5,120,80,.6);'
        + 'display:grid;place-items:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}'
        + '#daleFab:hover{transform:scale(1.08) rotate(-6deg);box-shadow:0 18px 40px -8px rgba(5,120,80,.7)}'
        + '#daleFab svg{width:28px;height:28px}'
        + '#daleFab .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#fde047;box-shadow:0 0 0 2px #047857}'
        + '#dalePanel{position:fixed;right:1.4rem;bottom:6.4rem;width:380px;max-width:calc(100vw - 2rem);height:560px;max-height:calc(100vh - 8rem);z-index:1000;'
        + 'background:#fffdf8;border:1px solid #ece4d6;border-radius:22px;box-shadow:0 30px 70px -20px rgba(6,28,15,.5);'
        + 'display:none;flex-direction:column;overflow:hidden;font-family:Inter,system-ui,sans-serif}'
        + '#dalePanel.open{display:flex;animation:daleUp .28s cubic-bezier(.2,.8,.2,1)}'
        + '@keyframes daleUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}'
        + '.dale-head{display:flex;align-items:center;gap:.7rem;padding:1rem 1.1rem;color:#fff;background:linear-gradient(135deg,#0c6b46,#065f3c)}'
        + '.dale-head .mk{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}'
        + '.dale-head .mk svg{width:20px;height:20px}'
        + '.dale-head h4{margin:0;font-family:Fraunces,serif;font-weight:700;font-size:1.1rem;line-height:1.1}'
        + '.dale-head p{margin:0;font-size:.74rem;color:rgba(255,255,255,.8)}'
        + '.dale-head .x{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.85);font-size:1.4rem;cursor:pointer;line-height:1;padding:.2rem}'
        + '.dale-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem;background:#fbf7ee}'
        + '.dale-b{max-width:84%;padding:.7rem .85rem;border-radius:14px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}'
        + '.dale-b.ai{align-self:flex-start;background:#fff;border:1px solid #ece4d6;color:#16271c;border-bottom-left-radius:4px}'
        + '.dale-b.me{align-self:flex-end;background:linear-gradient(135deg,#10b981,#047857);color:#fff;border-bottom-right-radius:4px}'
        + '.dale-b.err{align-self:flex-start;background:#fdeaea;border:1px solid #f6c9c9;color:#b0322c}'
        + '.dale-typing{align-self:flex-start;display:inline-flex;gap:4px;padding:.8rem .9rem;background:#fff;border:1px solid #ece4d6;border-radius:14px}'
        + '.dale-typing i{width:7px;height:7px;border-radius:50%;background:#9fb3a6;animation:daleBlink 1.2s infinite}'
        + '.dale-typing i:nth-child(2){animation-delay:.2s}.dale-typing i:nth-child(3){animation-delay:.4s}'
        + '@keyframes daleBlink{0%,60%,100%{opacity:.3}30%{opacity:1}}'
        + '.dale-chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem 1rem 0}'
        + '.dale-chip{font-size:.78rem;font-weight:600;color:#0f7a4b;background:#e7f4ec;border:1px solid #cdead8;border-radius:999px;padding:.35rem .7rem;cursor:pointer;transition:background .15s}'
        + '.dale-chip:hover{background:#d6efdf}'
        + '.dale-input{display:flex;gap:.5rem;padding:.8rem 1rem 1rem;border-top:1px solid #ece4d6;background:#fffdf8}'
        + '.dale-input textarea{flex:1;resize:none;border:1.5px solid #e2ddd0;border-radius:12px;padding:.6rem .8rem;font:inherit;font-size:.9rem;max-height:90px;outline:none}'
        + '.dale-input textarea:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12)}'
        + '.dale-input button{flex:none;width:44px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#10b981,#047857);color:#fff;display:grid;place-items:center}'
        + '.dale-input button svg{width:18px;height:18px}'
        + '@media(max-width:480px){#dalePanel{right:.6rem;left:.6rem;width:auto;bottom:5.6rem;height:70vh}}';
      var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

      var leaf = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>';
      var fab = document.createElement('button'); fab.id='daleFab'; fab.title='Ask Dale AI';
      fab.innerHTML = '<span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>';
      document.body.appendChild(fab);

      var panel = document.createElement('div'); panel.id='dalePanel';
      panel.innerHTML =
        '<div class="dale-head"><div class="mk">'+leaf+'</div><div><h4>Dale</h4><p>Your Agricore assistant</p></div><button class="x" aria-label="Close">&times;</button></div>'
        + '<div class="dale-msgs" id="daleMsgs"></div>'
        + '<div class="dale-chips" id="daleChips"></div>'
        + '<div class="dale-input"><textarea id="daleText" rows="1" placeholder="Ask Dale anything..."></textarea>'
        + '<button id="daleSend" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>';
      document.body.appendChild(panel);

      var msgs = panel.querySelector('#daleMsgs');
      var text = panel.querySelector('#daleText');
      var greeted = false;

      function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
      function bubble(content, cls){ var d=document.createElement('div'); d.className='dale-b '+cls; d.innerHTML=esc(content); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }
      function typing(){ var d=document.createElement('div'); d.className='dale-typing'; d.innerHTML='<i></i><i></i><i></i>'; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }

      function ctx(){ try { return (typeof window.__daleCtx==='function' ? (window.__daleCtx()||{}) : {}); } catch(e){ return {}; } }

      function renderChips(){
        var chips = (window.__daleChips || []);
        var box = panel.querySelector('#daleChips'); box.innerHTML='';
        chips.forEach(function(c){ var b=document.createElement('button'); b.className='dale-chip'; b.textContent=c; b.onclick=function(){ send(c); }; box.appendChild(b); });
      }

      async function send(q){
        q = (q!==undefined ? q : text.value).trim();
        if(!q) return;
        text.value=''; bubble(q,'me'); history.push({role:'user',content:q});
        var t = typing();
        try{
          var token = localStorage.getItem('access_token');
          var res = await fetch(ENDPOINT, {
            method:'POST',
            headers: Object.assign({'Content-Type':'application/json'}, token ? {'Authorization':'Bearer '+token} : {}),
            body: JSON.stringify({ prompt:q, context: ctx(), history: history.slice(-8) })
          });
          t.remove();
          if(!res.ok){ bubble(res.status===401 ? 'Please log in again to use Dale.' : 'Dale had trouble answering. Try again.', 'err'); return; }
          var data = await res.json();
          var reply = data.reply || data.detail || 'No response.';
          bubble(reply,'ai'); history.push({role:'assistant',content:reply});
        }catch(e){ t.remove(); bubble('Network error reaching Dale. Check your connection.', 'err'); }
      }

      function open(){
        panel.classList.add('open');
        if(!greeted){ greeted=true; bubble(window.__daleIntro || "Hi, I'm Dale. How can I help with this page?", 'ai'); renderChips(); }
        setTimeout(function(){ text.focus(); }, 50);
      }
      function close(){ panel.classList.remove('open'); }

      fab.addEventListener('click', function(){ panel.classList.contains('open') ? close() : open(); });
      panel.querySelector('.x').addEventListener('click', close);
      panel.querySelector('#daleSend').addEventListener('click', function(){ send(); });
      text.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
      text.addEventListener('input', function(){ text.style.height='auto'; text.style.height=Math.min(text.scrollHeight,90)+'px'; });
    })();
    </script>

</body>
</html>
