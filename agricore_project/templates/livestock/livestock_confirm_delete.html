{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold mb-4">Delete Animal</h1>
    <p>Are you sure you want to delete this animal?</p>
    <div class="mb-4">
        <strong>Tag ID:</strong> {{ animal.tag_id }}<br>
        <strong>Name:</strong> {{ animal.name }}<br>
        <strong>Breed:</strong> {{ animal.breed }}<br>
        <strong>Livestock Unit:</strong> {{ animal.livestock_unit.unit_name }}
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded">Delete</button>
        <a href="{% url 'livestock_list' %}" class="ml-4 text-gray-600">Cancel</a>
    </form>
</div>
{% endblock %}
