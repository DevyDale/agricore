{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-emerald-700 mb-6">Add Animal</h1>
    <form method="post" class="bg-white rounded-xl shadow p-8 max-w-lg mx-auto">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block font-semibold mb-1">Tag ID</label>
            <input type="text" name="tag_id" class="w-full border rounded px-3 py-2" required>
        </div>
        <div class="mb-4">
            <label class="block font-semibold mb-1">Name</label>
            <input type="text" name="name" class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block font-semibold mb-1">Sex</label>
            <select name="sex" class="w-full border rounded px-3 py-2">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block font-semibold mb-1">Age Group</label>
            <input type="text" name="age_group" class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block font-semibold mb-1">Breed</label>
            <input type="text" name="breed" class="w-full border rounded px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block font-semibold mb-1">Status</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="">Select</option>
                <option value="Healthy">Healthy</option>
                <option value="Sick">Sick</option>
                <option value="Sold">Sold</option>
                <option value="Deceased">Deceased</option>
            </select>
        </div>
        <div class="mb-6">
            <label class="block font-semibold mb-1">Livestock Unit</label>
            <select name="livestock_unit" class="w-full border rounded px-3 py-2">
                <option value="">Select Unit</option>
                {% for unit in units %}
                <option value="{{ unit.id }}">{{ unit.unit_name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded font-bold btn-glow">Add Animal</button>
    </form>
</div>
{% endblock %}
