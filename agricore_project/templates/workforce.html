<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Network — Agricore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/i18n.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{ --g500:#10b981; --g600:#059669; --g700:#047857; --cream:#faf6ee; --line:#ece4d6; --ink:#16271c; }
        *{ font-family:'Inter',sans-serif }
        body{ background:radial-gradient(130% 100% at 50% -8%, #fffdf8 0%, #f4efe3 60%); min-height:100vh; color:var(--ink) }
        #hero-title,.sec-title,.brand-name,.professional-card h3,.modal-content h2{ font-family:'Fraunces',serif; letter-spacing:-.01em }

        .header-gradient{ background:linear-gradient(135deg,#10b981 0%,#047857 100%); box-shadow:0 6px 24px rgba(5,120,80,.22) }

        /* farmland hero */
        .hero-container{ position:relative; overflow:hidden; border-radius:26px; background:#22432c; box-shadow:0 24px 60px -28px rgba(6,28,15,.55) }
        #hero-farmland{ position:absolute; inset:-2% }
        #hero-farmland svg{ width:100%; height:100% }
        .hero-overlay{ position:absolute; inset:0; background:linear-gradient(102deg, rgba(8,30,18,.8) 0%, rgba(8,30,18,.5) 48%, rgba(8,30,18,.22) 100%) }
        .hero-inner{ position:relative; z-index:2 }

        .glass-container{ background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 14px 36px -26px rgba(20,40,25,.5) }

        .professional-card{ background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; transition:all .3s cubic-bezier(.34,1.56,.64,1); box-shadow:0 4px 14px rgba(20,40,25,.05) }
        .professional-card:hover{ transform:translateY(-8px); border-color:#bfe3cd; box-shadow:0 22px 46px -22px rgba(16,120,75,.4) }

        .filter-btn{ background:#fff; border:2px solid var(--line); color:#5b6b60; padding:.6rem 1.1rem; border-radius:.85rem; font-weight:600; font-size:.875rem; transition:all .2s; cursor:pointer }
        .filter-btn:hover{ border-color:#cde3d4; background:#f6faf6 }
        .filter-btn.active{ background:linear-gradient(135deg,#10b981,#047857); color:#fff; border-color:transparent; box-shadow:0 6px 16px -4px rgba(5,120,80,.4) }

        .input-field{ background:#fff; border:2px solid var(--line); color:#1e293b; border-radius:.85rem; padding:.7rem 1rem; font-size:.9375rem; transition:all .2s }
        .input-field:focus{ outline:none; border-color:var(--g500); box-shadow:0 0 0 4px rgba(16,185,129,.12) }

        .btn-primary{ background:linear-gradient(135deg,#10b981,#047857); color:#fff; font-weight:700; padding:.8rem 1.6rem; border-radius:.9rem; border:none; cursor:pointer; transition:all .3s cubic-bezier(.34,1.56,.64,1); box-shadow:0 6px 16px -4px rgba(5,120,80,.4) }
        .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 24px -6px rgba(5,120,80,.5) }

        .rating-stars{ color:#f5b301 }

        .modal-backdrop{ background:rgba(15,30,20,.6); backdrop-filter:blur(8px) }
        .modal-content{ background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 30px 70px -20px rgba(0,0,0,.4) }

        /* flutter-style snackbar */
        .toast{ background:#2c2f36 !important; border:none !important; box-shadow:0 10px 30px rgba(0,0,0,.4) !important }
        .toast .fa-check-circle{ color:#6ee7b7 !important }
        .toast #toast-message{ color:#fff !important }

        .fab{ position:fixed; bottom:1.5rem; right:1.5rem; background:linear-gradient(135deg,#10b981,#047857); color:#fff; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 28px -6px rgba(5,120,80,.5); cursor:pointer; transition:all .3s; z-index:100 }
        .fab:hover{ transform:scale(1.12) rotate(8deg); box-shadow:0 16px 36px -6px rgba(5,120,80,.6) }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header-gradient sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-4 min-w-0">
                    <a href="marketplace.html" class="brand-name text-2xl font-bold text-white flex items-center gap-2 shrink-0">
                        <span class="w-9 h-9 rounded-xl bg-white/15 border border-white/25 grid place-items-center">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
                        </span>
                        Agricore
                    </a>
                    <span class="text-white/30 hidden sm:inline">|</span>
                    <h1 class="text-lg font-semibold text-white truncate hidden sm:block" id="heading-prof-network">Professional Network</h1>
                </div>
                <nav class="flex items-center gap-2 sm:gap-3 shrink-0">
                    <a href="marketplace.html" class="px-3.5 py-2 bg-white/10 border border-white/20 text-white hover:bg-white/20 font-semibold rounded-xl transition flex items-center gap-2">
                        <i class="fas fa-store"></i><span class="hidden md:inline">Marketplace</span>
                    </a>
                    <a href="multi_farm.html" class="px-3.5 py-2 bg-white/10 border border-white/20 text-white hover:bg-white/20 font-semibold rounded-xl transition flex items-center gap-2">
                        <i class="fas fa-tractor"></i><span class="hidden md:inline">My Farms</span>
                    </a>
                    <button id="profile-btn" class="px-3.5 py-2 bg-white text-emerald-700 rounded-xl font-bold hover:bg-emerald-50 transition flex items-center gap-2">
                        <i class="fas fa-user"></i><span class="hidden md:inline">Profile</span>
                    </button>
                    <select id="settings-language" class="px-2 py-1.5 rounded-lg border border-white/30 bg-white/10 text-white text-sm font-semibold focus:outline-none" style="min-width:96px;">
                        <option class="text-gray-800" value="en">English</option>
                        <option class="text-gray-800" value="fr">Français</option>
                        <option class="text-gray-800" value="es">Español</option>
                        <option class="text-gray-800" value="pt">Português</option>
                        <option class="text-gray-800" value="sw">Kiswahili</option>
                        <option class="text-gray-800" value="ar">العربية</option>
                    </select>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="container mx-auto px-6 pt-6 mb-10">
        <div class="hero-container px-6 py-16 md:py-24">
            <div id="hero-farmland"></div>
            <div class="hero-overlay"></div>
            <div class="hero-inner max-w-4xl mx-auto text-center text-white">
                <span class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-[.16em] text-white/85 bg-white/12 border border-white/20 px-3 py-1.5 rounded-full mb-5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-300"></span> Agricore Network
                </span>
                <h2 class="text-4xl md:text-6xl font-black mb-4 drop-shadow-2xl" id="hero-title">
                    Agricore Professional Network
                </h2>
                <p class="text-lg md:text-2xl mb-10 text-white/90 drop-shadow-lg" id="hero-desc">
                    Connect with skilled professionals to power your farm work
                </p>
                <div class="max-w-3xl mx-auto">
                    <div class="flex gap-3 bg-white/95 backdrop-blur-sm rounded-2xl p-2.5 shadow-2xl">
                        <input type="text" id="search-input" placeholder="Search by name, skills, or location..."
                            class="flex-1 px-5 py-3.5 bg-transparent text-gray-800 text-lg focus:outline-none">
                        <button id="search-btn" class="btn-primary whitespace-nowrap flex items-center gap-2">
                            <i class="fas fa-search"></i><span class="hidden sm:inline">Search</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Filters -->
    <section class="container mx-auto px-6 mb-8">
        <div class="glass-container p-6">
            <div class="mb-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4" id="filter-specialty-label">Filter by Specialty:</h3>
                <div class="flex flex-wrap gap-3">
                    <button class="filter-btn active" data-specialty="all" id="filter-all">All</button>
                    <button class="filter-btn" data-specialty="agronomist" id="filter-agronomist">Agronomists</button>
                    <button class="filter-btn" data-specialty="veterinarian" id="filter-veterinarian">Veterinarians</button>
                    <button class="filter-btn" data-specialty="mechanic" id="filter-mechanic">Mechanics</button>
                    <button class="filter-btn" data-specialty="farm_manager" id="filter-farm-manager">Farm Managers</button>
                    <button class="filter-btn" data-specialty="livestock_handler" id="filter-livestock-handler">Livestock Handlers</button>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2" id="label-min-rating">Minimum Rating</label>
                    <select id="rating-filter" class="input-field w-full">
                        <option value="" id="opt-any-rating">Any Rating</option>
                        <option value="4.5">4.5+ stars</option>
                        <option value="4.0">4.0+ stars</option>
                        <option value="3.5">3.5+ stars</option>
                        <option value="3.0">3.0+ stars</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2" id="label-max-rate">Max Hourly Rate ($)</label>
                    <input type="number" id="rate-filter" placeholder="e.g., 50" class="input-field w-full">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2" id="label-min-exp">Min Experience (years)</label>
                    <input type="number" id="experience-filter" placeholder="e.g., 5" class="input-field w-full">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2" id="label-availability">Availability</label>
                    <select id="availability-filter" class="input-field w-full">
                        <option value="" id="opt-all">All</option>
                        <option value="available" id="opt-available">Available Now</option>
                        <option value="full_time" id="opt-full-time">Full-Time</option>
                        <option value="part_time" id="opt-part-time">Part-Time</option>
                        <option value="contract" id="opt-contract">Contract</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Professionals Grid -->
    <section class="container mx-auto px-6 pb-12">
        <div class="flex items-center justify-between mb-6 gap-3 flex-wrap">
            <h3 class="sec-title text-2xl font-bold text-gray-800">
                <span id="professional-count">0</span> <span id="label-pros-available">Professionals Available</span>
            </h3>
            <select id="sort-select" class="input-field">
                <option value="-average_rating" id="opt-highest-rated">Highest Rated</option>
                <option value="hourly_rate" id="opt-lowest-rate">Lowest Rate</option>
                <option value="-hourly_rate" id="opt-highest-rate">Highest Rate</option>
                <option value="-years_experience" id="opt-most-experienced">Most Experienced</option>
                <option value="-created_at" id="opt-newest">Newest</option>
            </select>
        </div>

        <div id="professionals-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="empty-state" class="hidden text-center py-20 bg-white rounded-2xl border-2 border-dashed" style="border-color:var(--line)">
            <i class="fas fa-users text-gray-300 text-6xl mb-4"></i>
            <h3 class="text-xl font-bold text-gray-600 mb-2" id="label-no-pros">No professionals found</h3>
            <p class="text-gray-500" id="label-try-filters">Try adjusting your filters</p>
        </div>

        <div id="loading-state" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
            <div class="professional-card p-6 animate-pulse">
                <div class="w-full h-48 bg-gray-200 rounded-xl mb-4"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-1/2"></div>
            </div>
        </div>
    </section>

    <!-- Professional Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center z-50 p-6 overflow-y-auto">
        <div class="modal-content max-w-4xl w-full mx-auto my-8 p-8">
            <div class="flex justify-between items-start mb-6">
                <h2 class="text-3xl font-bold text-gray-800">Professional Details</h2>
                <button id="close-modal" class="text-gray-500 hover:text-gray-900 text-2xl"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 toast px-6 py-4 rounded-xl transform translate-x-full transition-transform z-50">
        <div class="flex items-center gap-3">
            <i class="fas fa-check-circle text-xl"></i>
            <span id="toast-message" class="font-semibold"></span>
        </div>
    </div>


    <script>
        /* farmland hero background — shared visual identity */
        (function(){
            function buildFarmland(){
                const W=1200,H=820,cols=7,rows=6, jx=(W/cols)*0.32, jy=(H/rows)*0.32, P=[];
                for(let r=0;r<=rows;r++){ P[r]=[]; for(let c=0;c<=cols;c++){ const edge=(r===0||r===rows||c===0||c===cols);
                    P[r][c]={ x:(c/cols)*W+(edge?0:(Math.random()*2-1)*jx), y:(r/rows)*H+(edge?0:(Math.random()*2-1)*jy) }; } }
                const pal=[['#2f5a34','#27502c'],['#3c7a3c','#336a33'],['#4f8438','#447730'],['#6f8d3f','#637f37'],['#8a9a4e','#7c8c42'],['#c39a48','#b58b3c'],['#d3ab57','#c59b48'],['#b15a36','#9f4e2e'],['#cdb878','#bda863']];
                const ang=[0,16,90,74,16,0,90,30,16]; let defs='';
                pal.forEach((c,i)=>{ defs+='<pattern id="cp'+i+'" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate('+ang[i]+')"><rect width="9" height="9" fill="'+c[0]+'"/><rect width="9" height="3.4" fill="'+c[1]+'"/></pattern>'; });
                const bag=[0,0,1,1,1,2,2,2,3,3,4,4,5,5,6,7,8]; let cells='';
                for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const a=P[r][c],b=P[r][c+1],d=P[r+1][c+1],e=P[r+1][c], fi=bag[Math.floor(Math.random()*bag.length)];
                    cells+='<polygon points="'+a.x.toFixed(1)+','+a.y.toFixed(1)+' '+b.x.toFixed(1)+','+b.y.toFixed(1)+' '+d.x.toFixed(1)+','+d.y.toFixed(1)+' '+e.x.toFixed(1)+','+e.y.toFixed(1)+'" fill="url(#cp'+fi+')" stroke="rgba(22,15,7,.17)" stroke-width="1.3"/>'; }
                return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>'+defs+'</defs>'+cells+'</svg>';
            }
            const el=document.getElementById('hero-farmland'); if(el) el.innerHTML=buildFarmland();
        })();
    </script>
    <script>
        // Language selector logic for workforce
        document.addEventListener('DOMContentLoaded', function() {
            const languageSelect = document.getElementById('settings-language');
            if (languageSelect) {
                // Set initial value from localStorage
                const lang = localStorage.getItem('preferred_language') || 'en';
                languageSelect.value = lang;
                languageSelect.addEventListener('change', function() {
                    localStorage.setItem('preferred_language', this.value);
                    if (window.i18n && typeof applyI18nStatic === 'function') {
                        applyI18nStatic();
                    } else if (window.i18n) {
                        location.reload(); // fallback: reload to apply
                    }
                });
                // Also trigger translation on page load
                if (window.i18n && typeof applyI18nStatic === 'function') {
                    applyI18nStatic();
                }
            }
        });
        let professionals = [];
        let currentFilters = {
            specialty: 'all',
            search: '',
            minRating: '',
            maxRate: '',
            minExperience: '',
            availability: '',
            ordering: '-average_rating'
        };

        // Ensure auth token is present
        function ensureAuth() {
            const token = localStorage.getItem('access_token');
            if (!token || token === 'null' || token === 'undefined') {
                showToast('Please log in to view professionals');
                setTimeout(() => {
                    window.location.href = 'authentication.html';
                }, 800);
                return false;
            }
            return true;
        }

        // Load professionals from API
        async function loadProfessionals() {
            if (!ensureAuth()) return;
            showLoading();
            try {
                const params = new URLSearchParams();
                
                if (currentFilters.specialty !== 'all') {
                    params.append('specialty', currentFilters.specialty);
                }
                if (currentFilters.search) {
                    params.append('search', currentFilters.search);
                }
                if (currentFilters.minRating) {
                    params.append('min_rating', currentFilters.minRating);
                }
                if (currentFilters.maxRate) {
                    params.append('max_rate', currentFilters.maxRate);
                }
                if (currentFilters.minExperience) {
                    params.append('min_experience', currentFilters.minExperience);
                }
                if (currentFilters.availability) {
                    params.append('availability', currentFilters.availability);
                }
                params.append('ordering', currentFilters.ordering);

                const token = localStorage.getItem('access_token');
                const response = await fetch(`/api/professional-profiles/?${params}`, {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });

                if (response.ok) {
                    professionals = await response.json();
                    renderProfessionals();
                } else {
                    showToast('Failed to load professionals');
                    renderProfessionals();
                }
            } catch (error) {
                console.error('Error loading professionals:', error);
                showToast('Error loading professionals');
                renderProfessionals();
            }
            hideLoading();
        }

        // Render professionals grid
        function renderProfessionals() {
            const grid = document.getElementById('professionals-grid');
            const emptyState = document.getElementById('empty-state');
            const countElement = document.getElementById('professional-count');

            countElement.textContent = professionals.length;

            if (professionals.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            grid.innerHTML = professionals.map(pro => {
                const profileImg = pro.profile_image_display || pro.profile_image_url || pro.profile_image;
                const initials = pro.user_name ? pro.user_name.substring(0, 2).toUpperCase() : 'PR';
                return `
                <div class="professional-card cursor-pointer group" onclick="showDetails(${pro.id})">
                    <div class="relative">
                        ${profileImg
                            ? `<img src="${profileImg}" alt="${pro.user_name || initials}" class="w-full h-48 object-cover rounded-t-xl" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                               <div class="hidden w-full h-48 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-t-xl items-center justify-center text-white">
                                   <div class="text-5xl font-bold">${initials}</div>
                               </div>`
                            : `<div class="w-full h-48 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-t-xl flex items-center justify-center text-white">
                                   <div class="text-5xl font-bold">${initials}</div>
                               </div>`
                        }
                        ${pro.is_verified ? '<span class="absolute top-3 right-3 bg-blue-500 text-white px-3 py-1 rounded-full text-xs font-bold"><i class="fas fa-check-circle mr-1"></i>Verified</span>' : ''}
                        ${pro.featured ? '<span class="absolute top-3 left-3 bg-yellow-500 text-white px-3 py-1 rounded-full text-xs font-bold"><i class="fas fa-star mr-1"></i>Featured</span>' : ''}
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-bold text-gray-800 mb-2 truncate">${pro.user_name || initials}</h3>
                        <p class="text-emerald-600 font-semibold mb-3">${pro.specialty_display || ''}</p>
                        <div class="flex items-center gap-2 mb-4">
                            <div class="rating-stars">
                                ${renderStars(pro.average_rating)}
                            </div>
                            <span class="text-gray-600 text-sm">${(pro.average_rating || 0).toFixed(1)} (${pro.total_reviews || 0})</span>
                        </div>
                        <div class="space-y-2 text-sm text-gray-600 mb-4">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-map-marker-alt text-emerald-600 w-4"></i>
                                <span class="truncate">${pro.location || ''}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fas fa-clock text-emerald-600 w-4"></i>
                                <span>${pro.years_experience || 0} years</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fas fa-dollar-sign text-emerald-600 w-4"></i>
                                <span>$${pro.hourly_rate || 0}/hour</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fas fa-briefcase text-emerald-600 w-4"></i>
                                <span class="truncate">${pro.availability_display || ''}</span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="event.stopPropagation(); showDetails(${pro.id})" class="flex-1 px-4 py-2 btn-primary text-sm" id="btn-view-profile">${window.i18n ? i18n.t('View Profile') : 'View Profile'}</button>
                            <button onclick="event.stopPropagation(); startChatWithProfessional(${pro.user})" class="px-4 py-2 border-2 border-emerald-600 text-emerald-600 rounded-xl font-semibold hover:bg-emerald-50 transition" id="btn-chat-prof"><i class="fas fa-envelope"></i></button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // Render star rating
        function renderStars(rating) {
            rating = Number(rating || 0);
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let stars = '';
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star"></i>';
            }
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            }
            const emptyStars = 5 - Math.ceil(rating);
            for (let i = 0; i < emptyStars; i++) {
                stars += '<i class="far fa-star"></i>';
            }
            return stars;
        }

        // Show professional details
        async function showDetails(id) {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');

        async function submitReview(proId) {
            const rating = document.getElementById('rv-rating').value;

    + '.dale-input{display:flex;gap:.5rem;padding:.8rem 1rem 1rem;border-top:1px solid #ece4d6;background:#fffdf8}'
    + '.dale-input textarea{flex:1;resize:none;border:1.5px solid #e2ddd0;border-radius:12px;padding:.6rem .8rem;font:inherit;font-size:.9rem;max-height:90px;outline:none}'
    + '.dale-input textarea:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12)}'
    + '.dale-input button{flex:none;width:44px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#10b981,#047857);color:#fff;display:grid;place-items:center}'
    + '.dale-input button svg{width:18px;height:18px}'
    + '@media(max-width:480px){#dalePanel{right:.6rem;left:.6rem;width:auto;bottom:5.6rem;height:70vh}}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  var leaf = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>';
  var fab = document.createElement('button'); fab.id='daleFab'; fab.title='Ask Dale AI';
  fab.innerHTML = '<span class="dot"></span><dotlottie-wc src="https://lottie.host/ac187fae-55ac-4ce4-93a9-fe037e3e2e57/jSdcU6a1Ig.lottie" autoplay loop></dotlottie-wc>';
  document.body.appendChild(fab);

  var panel = document.createElement('div'); panel.id='dalePanel';
  panel.innerHTML =
    '<div class="dale-head"><div class="mk">'+leaf+'</div><div><h4>Dale</h4><p>Your Agricore assistant</p></div><button class="x" aria-label="Close">&times;</button></div>'
    + '<div class="dale-msgs" id="daleMsgs"></div>'
    + '<div class="dale-chips" id="daleChips"></div>'
    + '<div class="dale-input"><textarea id="daleText" rows="1" placeholder="Ask Dale anything..."></textarea>'
    + '<button id="daleSend" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>';
  document.body.appendChild(panel);

  var msgs = panel.querySelector('#daleMsgs');
  var text = panel.querySelector('#daleText');
  var greeted = false;

  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function bubble(content, cls){ var d=document.createElement('div'); d.className='dale-b '+cls; d.innerHTML=esc(content); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }
  function typing(){ var d=document.createElement('div'); d.className='dale-typing'; d.innerHTML='<i></i><i></i><i></i>'; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }

  function ctx(){ try { return (typeof window.__daleCtx==='function' ? (window.__daleCtx()||{}) : {}); } catch(e){ return {}; } }

  function renderChips(){
    var chips = (window.__daleChips || []);
    var box = panel.querySelector('#daleChips'); box.innerHTML='';
    chips.forEach(function(c){ var b=document.createElement('button'); b.className='dale-chip'; b.textContent=c; b.onclick=function(){ send(c); }; box.appendChild(b); });
  }

  async function send(q){
    q = (q!==undefined ? q : text.value).trim();
    if(!q) return;
    text.value=''; bubble(q,'me'); history.push({role:'user',content:q});
    var t = typing();
    try{
      var token = localStorage.getItem('access_token');
      var res = await fetch(ENDPOINT, {
        method:'POST',
        headers: Object.assign({'Content-Type':'application/json'}, token ? {'Authorization':'Bearer '+token} : {}),
        body: JSON.stringify({ prompt:q, context: ctx(), history: history.slice(-8) })
      });
      t.remove();
      if(!res.ok){ bubble(res.status===401 ? 'Please log in again to use Dale.' : 'Dale had trouble answering. Try again.', 'err'); return; }
      var data = await res.json();
      var reply = data.reply || data.detail || 'No response.';
      bubble(reply,'ai'); history.push({role:'assistant',content:reply});
    }catch(e){ t.remove(); bubble('Network error reaching Dale. Check your connection.', 'err'); }
  }

  function open(){
    panel.classList.add('open');
    if(!greeted){ greeted=true; bubble(window.__daleIntro || "Hi, I'm Dale. How can I help with this page?", 'ai'); renderChips(); }
    setTimeout(function(){ text.focus(); }, 50);
  }
  function close(){ panel.classList.remove('open'); }

  fab.addEventListener('click', function(){ panel.classList.contains('open') ? close() : open(); });
  panel.querySelector('.x').addEventListener('click', close);
  panel.querySelector('#daleSend').addEventListener('click', function(){ send(); });
  text.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  text.addEventListener('input', function(){ text.style.height='auto'; text.style.height=Math.min(text.scrollHeight,90)+'px'; });
})();
</script>
</body>
</html>
