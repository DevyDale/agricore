<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agricore — Transporter</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fas fa-motorcycle text-xl"></i>
        <span class="font-extrabold text-lg">Agricore Transporter</span>
      </div>
      <a href="marketplace.html" class="text-sm opacity-90 hover:opacity-100"><i class="fas fa-store"></i> Marketplace</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 space-y-6">
    <section id="profile-section" class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
      <div class="text-center py-6 text-gray-400"><i class="fas fa-spinner fa-spin"></i> Loading your profile…</div>
    </section>

    <div class="flex gap-2">
      <button id="tab-open" class="flex-1 px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-600 text-white">Open jobs</button>
      <button id="tab-mine" class="flex-1 px-4 py-2 rounded-lg text-sm font-semibold bg-white text-gray-700 border border-gray-200">My jobs</button>
    </div>

    <section id="open-jobs" class="space-y-3"></section>
    <section id="my-jobs" class="space-y-3 hidden"></section>
  </main>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl text-sm hidden z-50"></div>

<script>
  const API_BASE = 'http://127.0.0.1:8000/api';
  const token = localStorage.getItem('token') || localStorage.getItem('access_token');
  if (!token) { window.location.href = 'authentication.html'; }

  let myProfile = null;
  let myPayout = null;

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(window.__tt); window.__tt = setTimeout(() => t.classList.add('hidden'), 2600);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + (token || '') }, opts.headers || {});
    const r = await fetch(API_BASE + path, opts);
    let body = null; try { body = await r.json(); } catch (e) {}
    if (!r.ok) { throw new Error((body && body.detail) || ('Request failed (' + r.status + ')')); }
    return body;
  }
  function listOf(data) { return Array.isArray(data) ? data : ((data && data.results) || []); }

  // ---------- profile ----------
  async function loadProfile() {
    const box = document.getElementById('profile-section');
    try {
      myProfile = await api('/transporters/me/');
      try { const _pa = await api('/payout-accounts/'); const _l = listOf(_pa); myPayout = _l[0] || null; } catch (e) { myPayout = null; }
      renderProfile();
    } catch (e) {
      myProfile = null;
      renderRegister();
    }
  }
  function renderRegister() {
    const box = document.getElementById('profile-section');
    box.innerHTML =
      '<h2 class="font-bold text-lg mb-1">Become a transporter</h2>'
      + '<p class="text-sm text-gray-500 mb-4">Register your vehicle to start accepting delivery jobs.</p>'
      + '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">'
      + field('reg_vehicle', 'Vehicle type', '<select id="reg_vehicle" class="inp"><option value="boda">Boda boda</option><option value="pickup">Pickup</option><option value="truck">Truck</option><option value="taxi">Taxi / van</option><option value="bicycle">Bicycle</option></select>')
      + field('reg_plate', 'Vehicle plate', '<input id="reg_plate" class="inp" placeholder="UAA 123A">')
      + field('reg_id', 'National ID', '<input id="reg_id" class="inp" placeholder="CM…">')
      + field('reg_phone', 'Phone (for SMS jobs)', '<input id="reg_phone" class="inp" placeholder="0772…">')
      + field('reg_area', 'Service area', '<input id="reg_area" class="inp" placeholder="Kampala, Wakiso…">')
      + '</div>'
      + '<button onclick="registerProfile()" class="mt-4 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700"><i class="fas fa-id-card"></i> Register</button>';
    styleInputs();
  }
  function renderPayout() {
    const el = document.getElementById('payout-card'); if (!el) return;
    if (myPayout && myPayout.account_number) {
      el.innerHTML = '<div class="flex items-center justify-between gap-2">'
        + '<div><p class="text-sm font-semibold text-gray-800"><i class="fas fa-wallet text-emerald-600"></i> Payout</p>'
        + '<p class="text-xs text-gray-500">' + esc(myPayout.method) + ' \u2022 ' + esc(myPayout.account_number) + ' \u2022 ' + esc(myPayout.account_name) + '</p></div>'
        + '<button onclick="editPayout()" class="text-xs font-semibold text-emerald-700 underline">Change</button></div>';
    } else {
      payoutForm(el);
    }
  }
  window.editPayout = function () { const el = document.getElementById('payout-card'); if (el) payoutForm(el); };
  function payoutForm(el) {
    el.innerHTML =
      '<p class="text-sm font-semibold text-gray-800 mb-2"><i class="fas fa-wallet text-emerald-600"></i> Where you get paid</p>'
      + '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'
      + '<select id="po_method" class="inp2"><option value="momo">Mobile Money</option><option value="bank">Bank</option></select>'
      + '<input id="po_num" class="inp2" placeholder="0772\u2026 (MoMo) or account no.">'
      + '<input id="po_name" class="inp2" placeholder="Account holder name">'
      + '<input id="po_net" class="inp2" placeholder="Network (MTN / AIRTEL)">'
      + '<select id="po_bank" class="inp2"><option value="">Bank (select if paying to a bank)</option></select>'
      + '</div>'
      + '<button onclick="savePayout()" class="mt-2 px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold hover:bg-emerald-700">Save payout details</button>';
    document.querySelectorAll('.inp2').forEach(function (x) { x.className = 'inp2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none'; });
    if (myPayout) {
      if (myPayout.method) document.getElementById('po_method').value = myPayout.method;
      document.getElementById('po_num').value = myPayout.account_number || '';
      document.getElementById('po_name').value = myPayout.account_name || '';
      document.getElementById('po_net').value = myPayout.network || '';
    }
    (async function () {
      var sel = document.getElementById('po_bank'); if (!sel) return;
      var toText = function () { var i = document.createElement('input'); i.id = 'po_bank'; i.className = sel.className; i.placeholder = 'Bank code (bank only)'; sel.replaceWith(i); };
      try {
        var bd = await api('/payout-accounts/banks/');
        var banks = (bd && bd.banks) || [];
        if (!banks.length) { toText(); return; }
        sel.innerHTML = '<option value="">Bank (select if paying to a bank)</option>'
          + banks.map(function (b) { return '<option value="' + esc(b.code) + '">' + esc(b.name) + '</option>'; }).join('');
        if (myPayout && myPayout.account_bank && myPayout.account_bank !== 'MPS') sel.value = myPayout.account_bank;
      } catch (e) { toText(); }
    })();
  }
  window.savePayout = async function () {
    const payload = {
      method: document.getElementById('po_method').value,
      account_number: document.getElementById('po_num').value.trim(),
      account_name: document.getElementById('po_name').value.trim()
    };
    const net = document.getElementById('po_net').value.trim(); if (net) payload.network = net;
    const bank = document.getElementById('po_bank').value.trim(); if (bank) payload.account_bank = bank;
    try {
      let saved;
      if (myPayout && myPayout.id) saved = await api('/payout-accounts/' + myPayout.id + '/', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      else saved = await api('/payout-accounts/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      myPayout = saved; toast('Payout details saved.'); renderPayout();
    } catch (e) { toast(e.message || 'Could not save payout details.'); }
  };
  function renderProfile() {
    const p = myProfile;
    const badge = p.is_verified
      ? '<span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full"><i class="fas fa-circle-check"></i> Verified</span>'
      : '<span class="text-xs font-semibold text-amber-700 bg-amber-50 px-2 py-1 rounded-full"><i class="fas fa-clock"></i> Pending verification</span>';
    const box = document.getElementById('profile-section');
    box.innerHTML =
      '<div class="flex items-start justify-between gap-3">'
      + '<div><h2 class="font-bold text-lg">' + esc(p.user_name || 'Transporter') + '</h2>'
      + '<p class="text-sm text-gray-500">' + esc(p.vehicle_type) + (p.vehicle_plate ? (' • ' + esc(p.vehicle_plate)) : '') + (p.service_area ? (' • ' + esc(p.service_area)) : '') + '</p>'
      + '<p class="text-sm text-amber-600 mt-1"><i class="fas fa-star"></i> ' + (Number(p.rating_avg || 0).toFixed(1)) + ' (' + (p.rating_count || 0) + ')</p>'
      + '</div>' + badge + '</div>'
      + (p.is_verified ? '' : '<p class="text-xs text-gray-400 mt-3">Unverified riders can only accept lower-value orders until an admin verifies you.</p>')
      + '<div id="payout-card" class="mt-4 pt-4 border-t border-gray-100"></div>';
    renderPayout();
  }
  function field(id, label, control) {
    return '<div><label class="block text-xs font-semibold text-gray-600 mb-1">' + label + '</label>' + control + '</div>';
  }
  function styleInputs() {
    document.querySelectorAll('.inp').forEach(el => { el.className = 'inp w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none'; });
  }
  window.registerProfile = async function () {
    const payload = {
      vehicle_type: document.getElementById('reg_vehicle').value,
      vehicle_plate: document.getElementById('reg_plate').value.trim(),
      national_id: document.getElementById('reg_id').value.trim(),
      phone: document.getElementById('reg_phone').value.trim(),
      service_area: document.getElementById('reg_area').value.trim()
    };
    try {
      myProfile = await api('/transporters/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      toast('Profile created. You can now accept jobs.');
      renderProfile();
      loadOpenJobs();
    } catch (e) { toast(e.message || 'Could not register.'); }
  };

  // ---------- jobs ----------
  function jobCard(j, mode) {
    const fee = (j.offered_fee && Number(j.offered_fee) > 0) ? (Number(j.offered_fee).toLocaleString() + ' ' + (j.currency || 'UGX')) : '—';
    let actions = '';
    if (mode === 'open') {
      actions = '<button onclick="acceptJob(' + j.id + ')" class="px-3 py-1.5 text-xs font-semibold bg-emerald-600 text-white rounded-lg hover:bg-emerald-700"><i class="fas fa-hand"></i> Accept</button>';
    } else {
      if (j.status === 'accepted') actions = '<button onclick="pickupJob(' + j.id + ')" class="px-3 py-1.5 text-xs font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-box"></i> Mark pickup (enter seller code)</button>';
      else if (j.status === 'picked_up') actions = '<button onclick="confirmJob(' + j.id + ',' + (j.escrow || 'null') + ')" class="px-3 py-1.5 text-xs font-semibold bg-emerald-600 text-white rounded-lg hover:bg-emerald-700"><i class="fas fa-key"></i> Confirm delivery (enter buyer code)</button>';
      else actions = '<span class="text-xs text-gray-500">' + esc(j.status) + '</span>';
    }
    return '<div class="bg-white rounded-xl border border-gray-100 p-4">'
      + '<div class="flex items-start justify-between gap-2">'
      + '<div><p class="font-semibold text-gray-800">Order #' + esc(j.order) + '</p>'
      + '<p class="text-xs text-gray-500">' + esc(j.vehicle_type_required || 'any vehicle') + ' • fee ' + fee + '</p>'
      + (j.pickup_location ? '<p class="text-xs text-gray-500 mt-1"><i class="fas fa-location-dot text-emerald-600"></i> from ' + esc(j.pickup_location) + '</p>' : '')
      + (j.drop_location ? '<p class="text-xs text-gray-500"><i class="fas fa-flag-checkered"></i> to ' + esc(j.drop_location) + '</p>' : '')
      + ((j.seller_phone || j.seller_name) ? '<p class="text-xs text-gray-700 mt-1"><i class="fas fa-user-tie text-emerald-600"></i> Seller: ' + esc(j.seller_name || '\u2014') + (j.seller_phone ? (' \u00b7 <a href="tel:' + esc(j.seller_phone) + '" class="text-emerald-700 underline">' + esc(j.seller_phone) + '</a>') : '') + '</p>' : '')
      + '</div>'
      + '<span class="text-[11px] font-semibold px-2 py-1 rounded-full bg-gray-100 text-gray-600">' + esc(j.status) + '</span>'
      + '</div>'
      + '<div class="mt-3">' + actions + '</div>'
      + '</div>';
  }
  async function loadOpenJobs() {
    const box = document.getElementById('open-jobs');
    box.innerHTML = '<div class="text-center py-6 text-gray-400"><i class="fas fa-spinner fa-spin"></i> Loading open jobs…</div>';
    try {
      const jobs = listOf(await api('/delivery-jobs/?scope=open'));
      box.innerHTML = jobs.length ? jobs.map(j => jobCard(j, 'open')).join('') : emptyState('No open jobs right now.');
    } catch (e) { box.innerHTML = emptyState(e.message || 'Could not load jobs.'); }
  }
  async function loadMyJobs() {
    const box = document.getElementById('my-jobs');
    box.innerHTML = '<div class="text-center py-6 text-gray-400"><i class="fas fa-spinner fa-spin"></i> Loading your jobs…</div>';
    try {
      const jobs = listOf(await api('/delivery-jobs/?scope=mine_transporter'));
      box.innerHTML = jobs.length ? jobs.map(j => jobCard(j, 'mine')).join('') : emptyState('You have no active jobs.');
    } catch (e) { box.innerHTML = emptyState(e.message || 'Could not load your jobs.'); }
  }
  function emptyState(msg) { return '<div class="text-center py-10 text-gray-400"><i class="fas fa-inbox text-2xl mb-2"></i><p class="text-sm">' + esc(msg) + '</p></div>'; }

  window.acceptJob = async function (id) {
    try { await api('/delivery-jobs/' + id + '/accept/', { method: 'POST' }); toast('Job accepted. Head to the seller for pickup.'); loadOpenJobs(); loadMyJobs(); }
    catch (e) { toast(e.message || 'Could not accept.'); }
  };
  window.pickupJob = async function (id) {
    const code = prompt('Enter the pickup code the seller shows you:');
    if (code === null) return;
    try { await api('/delivery-jobs/' + id + '/pickup/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pickup_code: String(code).trim() }) }); toast('Picked up. The buyer has been sent their delivery code.'); loadMyJobs(); }
    catch (e) { toast(e.message || 'Could not mark pickup.'); }
  };
  window.confirmJob = async function (id, escrowId) {
    if (!escrowId) { toast('No escrow linked to this job.'); return; }
    const otp = prompt('At the buyer, enter the delivery code they read out to you:');
    if (otp === null) return;
    try { await api('/escrows/' + escrowId + '/confirm_delivery/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ otp: String(otp).trim() }) }); toast('Delivery confirmed. Thank you!'); loadMyJobs(); }
    catch (e) { toast(e.message || 'Could not confirm delivery.'); }
  };

  // ---------- tabs ----------
  function showTab(which) {
    const open = which === 'open';
    document.getElementById('open-jobs').classList.toggle('hidden', !open);
    document.getElementById('my-jobs').classList.toggle('hidden', open);
    document.getElementById('tab-open').className = 'flex-1 px-4 py-2 rounded-lg text-sm font-semibold ' + (open ? 'bg-emerald-600 text-white' : 'bg-white text-gray-700 border border-gray-200');
    document.getElementById('tab-mine').className = 'flex-1 px-4 py-2 rounded-lg text-sm font-semibold ' + (!open ? 'bg-emerald-600 text-white' : 'bg-white text-gray-700 border border-gray-200');
    if (open) loadOpenJobs(); else loadMyJobs();
  }
  document.getElementById('tab-open').onclick = () => showTab('open');
  document.getElementById('tab-mine').onclick = () => showTab('mine');

  loadProfile();
  loadOpenJobs();
</script>
</body>
</html>
