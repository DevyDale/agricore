      operationId: escrows_pay_create
      description: |-
        Buyer starts payment for this escrow. Returns a Flutterwave checkout
        link (MTN/Airtel mobile money or card). The webhook confirms it later.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this escrow.
        required: true
