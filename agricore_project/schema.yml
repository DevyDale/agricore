    get:
      operationId: advertisements_list
      tags:
      - advertisements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Advertisement'
          description: ''
    post:
      operationId: advertisements_create
      tags:
      - advertisements
      requestBody:
