openapi: 3.0.3
info:
  title: Agricore API
  version: 1.0.0
  description: 'Backend API for the Agricore agricultural commerce platform: farms,
    crops, livestock, inventory, marketplace, escrow payments, market prices, logistics,
    workforce, AI, and notifications.'
