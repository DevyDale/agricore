    get:
      operationId: professional_profiles_list
      description: |-
        ViewSet for managing professional profiles in the agricultural network.
        Supports searching, filtering, and rating.
      parameters:
      - in: query
        name: availability
        schema:
          type: string
          enum:
          - available
          - contract
          - full_time
          - not_available
          - part_time
          - seasonal
        description: |-
          * `full_time` - Full-Time
          * `part_time` - Part-Time
          * `contract` - Contract
          * `seasonal` - Seasonal
          * `available` - Available Now
          * `not_available` - Not Available
      - in: query
        name: is_verified
        schema:
          type: boolean
      - in: query
        name: location
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: specialty
        schema:
          type: string
          enum:
          - agricultural_economist
          - agricultural_engineer
          - agricultural_technician
          - agronomist
          - chemist
          - crop_consultant
          - data_analyst
          - equipment_operator
          - farm_laborer
          - farm_manager
          - food_safety
          - harvester
          - horticulturist
          - irrigation_specialist
          - livestock_handler
          - mechanic
          - pest_control
          - planting_specialist
          - soil_scientist
          - veterinarian
