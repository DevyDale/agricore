    post:
      operationId: escrows_release_create
      description: |-
        Buyer confirms delivery -> pay the seller. The escrow flips to
        'released' only when Flutterwave confirms the payout (via webhook).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this escrow.
        required: true
      tags:
      - escrows
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Payout to the seller is initiated; the escrow flips to 'released'
            once Flutterwave confirms the payout via webhook.
